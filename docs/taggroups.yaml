# Sole master for the TagGroup catalog — split out of docs/tags.yaml, which
# is long enough without it. Same
# posture as docs/tags.yaml: hand-edited, `slug` is the stable match key,
# synced upsert-only by db/lib/syncTags.js#syncTagsFromYaml, which reads
# this file and docs/tags.yaml together and never deletes on its own — a
# separate, opt-in `npm run db:prune-tags` prunes tags absent from
# docs/tags.yaml and, once no surviving tag sits in them, groups absent
# from this file too — see docs/systemdocs/SYNC.md §3b, docs/tags.yaml's
# header and docs/systemdocs/TAGS.md.
#
# Entries are keyed by slug (`general-traits:`, not `- slug: general-traits`)
# — see docs/tags.yaml's header for why, and db/lib/yamlEntries.js.
#
# Per-group fields:
#   category    - must match one of the category slugs declared in
#                 docs/tags.yaml's `categories:` list.
#   requiredTag - optional slug of a Tag that gates every tag in this group
#                 (see docs/tags.yaml's requiredTag docs for the same idea
#                 at the single-tag level). This is the "hidden category"
#                 mechanism: a category whose every group is gated has no tab
#                 at all in the point-buy and Add Tag menus, and its tags are
#                 withheld from /api/tags, until the character holds the
#                 required tag. Enforced in web/lib/characterCreation.js
#                 (requirementSatisfied), and re-checked server-side by
#                 createCharacter and addTagRequest.
#
# A GROUP HAS NO COLOUR. It used to: every group carried a freeform hex, and
# every chip in it wore that hex as its 3px left rule. The palette behind
# those hexes was careful — one hue family per category, groups stepping by
# lightness inside it — and it still did not work on a real sheet. The steps
# within a hue were too fine to tell apart, Items-teal sat next to
# Skills-green, and forty-odd bright stripes with no key read as confetti.
#
# It is two signals now, one per level, and neither is authored here:
#   * COLOUR says which CATEGORY, from the seven --tag-* tokens in
#     web/app/globals.css — themed, muted, and gated at 3:1 against the
#     surface by `npm run audit:contrast --workspace=web`.
#   * The ICON says which GROUP, from web/lib/tagIcons.js, keyed by the slugs
#     below.
#
# So: to change what a group looks like, add or change its line in
# web/lib/tagIcons.js. Do not give this file a `color` field back — that is
# the thing that made the sheet motley.
groups:
  general-traits:
    name: Traits
    category: general
  general-social:
    name: Social
    category: general
  # What a character actually believes. Ungated on purpose — a belief is not a
  # secret the way the Demoness group below is, and #info already
  # tells every player that "most people are Post-Christian, but some people
  # believe in the Old Ways".
  #
  # Wears the General blue like the rest of the category; what separates it
  # from its neighbours is tone, not hue — a muted mid slate between Traits'
  # clear steel blue and Brigands' mauve. 4.13:1 on dusk, 4.28:1 on dawn.
  general-beliefs:
    name: Beliefs
    category: general
  # Desires rework (2026-08-31): the Addiction/Restriction/Interest ladder got
  # its own three groups instead of living scattered through Traits and The
  # Court. All ungated, same reasoning as Traits/Social/Beliefs — nothing here
  # is a secret.
  #
  # Personality rework (2026-09-01): Restrictions and Interests collapsed into
  # ONE group. The old split said a Restriction only ever closes the catalog
  # and an Interest only ever opens it, which made every Restriction a dead
  # end — Pacifist cost points and gave nothing back. A Personality tag is now
  # free to be negative AND open Desires nobody else can reach, so the two
  # halves stopped being different kinds of thing. Addictions stayed separate
  # because "one Addiction at a time" is a real rule, and a group is where you
  # see it.
  general-addictions:
    name: Addictions
    category: general
  # One value covering the ground the two old groups held, sitting between
  # their #7f88bd and #9db4e0 and staying inside the General blue/indigo family
  # THE PALETTE requires. 4.28:1 on dusk, 4.43:1 on dawn — comfortably clear of
  # the 3:1 floor, and of general-restrictions' 3.83 which was the tightest of
  # the two it replaces.
  general-personality:
    name: Personality
    category: general
  # Orphaned by the Personality rework above: general-personality took every
  # tag both of these held. Sync never deletes, and `db:prune-tags` only
  # prunes an empty group once it's absent from this file — so these rows
  # survive empty as long as they stay listed here, same as status-health
  # below. Don't reuse either slug, and don't put anything back in them.
  general-restrictions:
    name: Restrictions
    category: general
  general-interests:
    name: Interests
    category: general
  # Two body-membership groups, gated the same way Demoness is
  # (see the bottom of this file). Gating here rather than repeating
  # `requiredTag` on every member is the established idiom, and it means a
  # player who isn't in the body never sees the group at all. Unlike Demoness
  # these sit in the `general` category, which stays visible
  # because general-traits and general-social are ungated.
  general-cerberon:
    name: Cerberon
    category: general
    requiredTag: cerberon
  general-brigand:
    name: Brigands
    category: general
    requiredTag: brigand
  # Third body-membership group: the Baron's court, gated behind the free
  # `courtier` tag every court role starts with.
  general-court:
    name: The Court
    category: general
    requiredTag: courtier
  # Places you know about that are not on any map a stranger could read. A
  # tag here is knowledge, not a possession: it opens a hidden room's door
  # and nothing else. Ungated as a group, because each member is granted by
  # a role rather than bought — nobody browses this in the point-buy.
  #
  # The General blue, one step down in lightness from Traits so the two
  # don't read as the same chip: 3.33 on dusk, 3.51 on dawn.
  general-location:
    name: Location
    category: general
  # Orphaned: the Health category below took every tag that used to live
  # here. Sync never deletes, and `db:prune-tags` only prunes an empty group
  # once it's absent from this file — so this row survives empty as long as
  # it stays listed here. Don't reuse the slug, and don't put anything back
  # in it.
  status-health:
    name: Health
    category: status
  status-food:
    name: Food
    category: status
  status-buffs:
    name: Buffs
    category: status
  status-debuffs:
    name: Debuffs
    category: status
  items-food:
    name: Food
    category: items
  # Sowing tickets and harvested crops (db/lib/soilery.js) — separate from
  # Food since a raw seed packet isn't a meal.
  items-seeds:
    name: Seeds
    category: items
  # Tonic is its own group rather than a corner of Food: the catalog is a
  # supply chain (fungus -> Bliss, grain -> Alcohol -> the Red) and the
  # tonics above it are nothing like a meal. See the Alcohol & Drugs
  # document in docs/documents.yaml.
  items-drink:
    name: Tonic
    category: items
  items-gear:
    name: Gear
    category: items
  items-armor:
    name: Armor
    category: items
  # Split out of Armor once headgear started deciding what a character's FACE
  # is (Tag.concealSprite, docs/systemdocs/PROXYING.md §5). A helm is no longer
  # just plate that happens to sit high up: a mask with no armour value at all
  # belongs here, and a breastplate does not, so grouping by body part reads
  # better on a sheet than grouping by what stops a blade.
  items-headgear:
    name: Headgear
    category: items
  # The exotic tier: relics, grafts and machinery that don't belong to the
  # low-fantasy surface of the game. Kept apart from Gear so a player reading
  # their sheet can tell at a glance which of their possessions are ordinary.
  items-special:
    name: Special
    category: items
  # Keys. Split out of Gear because a key is not equipment — it weighs
  # nothing, does nothing in a fight, and its whole value is the one door it
  # opens (a Room's `access:` list in docs/zones.yaml). Grouping them means a
  # GM can see every lock in the game in one screen.
  #
  # Deeper than Gear's teal, because the light theme is the binding
  # constraint: 3.56 on dusk, 3.28 on dawn. The obvious brighter cyan
  # measured 2.25 on dawn and would have been unreadable there.
  items-keys:
    name: Keys
    category: items
  items-weapons:
    name: Weapons
    category: items
  # Bodies. Three monster corpses live here from docs/tags.yaml, and so does
  # every "{name}'s Corpse" a death writes (db/lib/corpseMint.js) — which is
  # why the group, not a catalog flag, is what the client-side code checks:
  # a per-character corpse tag is never in the YAML for anything else to name.
  #
  # The darkest of the Items teals on purpose. It has to clear 3:1 on BOTH
  # chip backgrounds, which for this family is a narrow band, and it should
  # read as the grimmest thing in the category.
  items-corpse:
    name: Corpses
    category: items
  # Parts cut off a person, one at a time (docs/systemdocs/TORTURE.md §6).
  # Deliberately NOT items-corpse: that group slug is CORPSE_GROUP_SLUG, the
  # thing db/lib/corpses.js#isCorpseTag matches on, so an eye filed there would
  # answer a `group: items-corpse` recipe ingredient and turn up in the Butcher
  # and Bury pickers. Not items-food either — a heart is not groceries.
  #
  # The one rose in Items, and the only place the Health red leaks into the
  # category, which is the point: these came off somebody. Measured against the
  # six chip backgrounds items-paper lists: 3.93 / 3.18 / 4.17 / 3.42 / 3.19 /
  # 3.33. Re-measure all six before changing it.
  items-remains:
    name: Remains
    category: items
  # Paper, wax stamps, and every sheet anybody writes on
  # (docs/systemdocs/PAPERWORK.md). Like items-corpse, this group holds both
  # catalog rows and rows the game mints at runtime, and for the same reason:
  # a written note is per-character and never in the YAML, so the GROUP is
  # what code checks rather than any catalog flag.
  #
  # The one warm colour in Items, and deliberately — paper is the only thing
  # in the category that is not metal, meat or machinery, and a player
  # scanning their sheet should be able to find their letters without reading.
  #
  # The band is razor-thin, the same trap items-corpse documents: a group
  # colour is not theme-aware, so one value has to clear 3:1 on the dusk chip
  # (#1e352f/#27443e), the brown one (#362a24/#46372d) AND the dawn one
  # (#fbfaf7/#ffffff). Every warmer, softer parchment tone measured 2.87–2.89
  # on dawn. This one measures 3.93 / 3.18 / 3.19 / 3.33 / 4.17 / 3.42, which
  # is about as good as the constraint allows — don't "improve" it toward
  # something more paper-coloured without re-measuring all six.
  items-paper:
    name: Paper
    category: items
  # --- Health ------------------------------------------------------------
  # Every affliction a doctor might treat, split by what KIND of medicine it
  # wants rather than by severity — severity is carried by the tag's own
  # requirement block (the cure ladder, docs/systemdocs/TAGS.md §5c). The
  # whole category is ONE red on purpose, split only by tone: blood red for
  # wounds, rust for rot, rose for fever, dusky mauve for the head, ash for
  # what can't be undone, pale pink for the trivial, apricot for recovery.
  health-wounds:
    name: Wounds
    category: health
  health-infection:
    name: Infection
    category: health
  health-illness:
    name: Illness
    category: health
  health-maiming:
    name: Maiming
    category: health
  health-mind:
    name: Mind
    category: health
  health-minor:
    name: Ailments
    category: health
  health-recovery:
    name: Recovery
    category: health
  assets-property:
    name: Property
    category: assets
  assets-companions:
    name: Companions
    category: assets
  # Structures: what a Craft with a `placement:` block raises at a Location
  # (db/lib/structures.js), rather than landing in a pocket. Stone family
  # like the rest of Assets, stepped between Property's pale grey and
  # Companions' warm brown.
  assets-structures:
    name: Structures
    category: assets
  # Skill families, clustered the same way General and Status already are.
  # A handful of standalone Skills tags (forester, musician, lockpicking,
  # butcher, climbing, stealth, and the Teaching tree) stay groupless on purpose — they don't
  # belong to any family and would just be noise in a one-tag group. The one
  # exception is Teaching (Drill Instructor), a Skill that borrows
  # general-cerberon purely for its requiredTag gate.
  skills-work:
    name: Work
    category: skills
  skills-fighting:
    name: Combat
    category: skills
  skills-crafting:
    name: Crafting
    category: skills
  skills-brewing:
    name: Brewing
    category: skills
  skills-cooking:
    name: Cooking
    category: skills
  skills-medical:
    name: Medical
    category: skills
  # --- Gated groups ------------------------------------------------------
  # These carry `requiredTag`, which is what makes the Demoness category
  # hidden. Every tag in it is gated by the group, so the tags themselves
  # deliberately do NOT repeat `requiredTag` — the gate is written once here.
  demoness:
    name: Demoness
    category: demoness
    requiredTag: demoness