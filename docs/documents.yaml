explanation:
  tag: Anyone with this tag gets this Document.
  public: If assigned, this will appear in a player's document folder. However, using the search function, anyone can browse and find this document.
# Documents are a map keyed by their document key (`courtier:`, not
# `- key: courtier`) — see docs/tags.yaml's header, and db/lib/yamlEntries.js.
documents:
  courtier:
    name: Courtier
    public: false
    tags: []
    description: As a member of the Baron's retinue, you may take food from a fellow member whenever you please — within reason (Treasurer and Leader roles can see everyone's Resources, so don't steal. If you'd like to steal, arrange it with a GM).
  church:
    name: Church
    public: false
    tags: []
    description: As a member of the Church, you may take food from a fellow member whenever you please — within reason (Treasurer and Leader roles can see everyone's Resources, so don't steal. If you'd like to steal, arrange it with a GM).
  independent:
    name: Independent
    public: false
    tags: []
    description: As an independent townsman, you aren't on anyone's payroll. The Headman isn't expected to pay you. You should therefore ply a trade so you don't starve to death.
  ravenhearteconomy:
    name: Ravenheart's Economy
    public: true
    tags: []
    description: |-
      The Baron protects Ravenheart. In exchange, its commoners farm, fish, and hunt. They keep enough to feed themselves, but the rest is taxed. The town's laborers aren't independent contractors; they're peasants in a feudal system.
  godking:
    name: The God-King
    public: false
    tags: []
    description: |-
      Ravenheart's liege is God-King Enoch II, a mercurial and unpredictable ruler. Usually, he is quite calm and allows Ravenheart to do whatever it pleases. Wartime is a different matter however — and as of this year, he is busy trading howitzer blows with a rival state several mountain ranges south of Ravenheart. The Arbiter represents his interests in court, and arranges the royal tithe if such a thing becomes necessary.
  treasurer:
    name: Treasurer
    public: true
    tags:
      - Treasurer
      - Leader
    description: |-
      As Treasurer or Leader, you can see each faction member's Resources.

      **Transferring Resources**

      You may transfer Resources from any source to any recipient, provided you are in the same Location as both.
  sanctuary:
    name: Sanctuary
    public: true
    description: |-
      The Sanctuary remains outside Ravenheart's feudal structure. Its plaster walls are stocked with near-modern medical equipment. There is a set of {tag:surgical-equipment} laid out in the operating theatre, which anyone in that room may use.

      The Sanctuary operates independently from the Baron. Although he could try to gain control over it, it would be unprecedented and pretty pointless. So the Esculap does whatever he wants within his walls.

      Due to the cost of medical procedures, the Esculap only treats people who can pay, or people of noble blood. You should only expect medical treatment if you can pay for it.
  teachingskills:
    name: Teaching Skills
    public: true
    tags: []
    # [PLAYER TEXT — Bascinet to rewrite]
    description: "Skills can be taught. Find someone standing with you who holds the skill and press Learn Skill on your sheet — or they press Teach Skill. Learning is a Gambit for the student. Anyone can teach what they know: it takes the teacher's whole turn, and the student learns on a 6. Someone with the {tag:teaching} tag spends no Move at all, can take up to three students a turn, and their students learn on a 5 or 6. A {tag:teaching-drill-instructor}'s students succeed on a 4 when the skill is a fighting skill."
  production:
    name: Producing Resources
    public: true
    tags:
      - Prospecting
      - Soilery
    # [PLAYER TEXT — Bascinet to rewrite]
    description: ""
  combat:
    name: Combat
    public: true
    tags: []
    description: |-
      The nitty-gritty of combat is as important as the fighters' skills. Even a master fencer would struggle against a peasant in plate armor, and just a few horse archers can take out a whole squad of footpads. Different weapons excel in different circumstances, like how much space you have, whether you're alone or in formation, and whether your opponent is armored.

      **Melee**
      - Polearms are ubiquitous. Their reach means you can keep the opponent away and decide when the battle starts. They come in stabby, crushy, and pokey varieties.
      - Blunt weapons are useful even against armored targets, but won't help find weak spots.
      - Precision weapons, like swords held by the blade (halfswording) or daggers, are useful against armored opponents if you can wrestle them down to the ground.
      - Hidden weapons are useful in social environments.
      - Cutting and stabbing weapons really hurt unarmored people.
      - Axes can break shields or drag them out of position.

      **Ranged**
      - Bows and slingshots are quiet and really hurt unarmored targets. Very big bows can crack or penetrate armor.
      - Crossbows take time to reload but are better against armored opponents.
      - Firearms beat everything.

      Shields are very useful. For armor, there's a few important traits: material, concealability, weight, and donning time. Some items can be worn under regular clothes. Certain items, like plate, will make a long trek through the forest difficult but make you a veritable tank in combat. However, it also has the downside of being hard to equip, so if you're at a feast and someone pulls out a dagger, you'd better have a padded jack or brigandine underneath.

      **Energy Shields**
      - Stop projectiles.
      - Reduce, but don't stop, melee damage.
      - Do nothing against needles or syringes.
      - Worn on the belt or the wrist.
  townstarting:
    name: Town Starting Packet
    public: false
    tags: []
    description: |-
      The Headman received a raven saying the fortress didn't receive the last tax wagon. It was probably ambushed by bandits. The Meister won't be happy about this… prepare to be squeezed for it.

      Last week, Thomas Ciobanu — a respectable tradesman — was found milky-eyed, giggly, with a profoundly satisfied look. He wandered around aimlessly, going hungry — when people tried to help him, he just called them fools. The Esculap's medicine couldn't do anything for him, so the Inquisitor had him hanged. He fought all the way to the gallows, like a rabid dog.
  lifewebbasic:
    name: Lifeweb
    public: true
    tags: []
    description: |-
      The Lifeweb is a profoundly unintelligible piece of machinery within the Fortress's walls — a tower that, at its peak, spews the Life Fire. Although it also produces electricity, it is mainly prized for the Fire, which is said to be what keeps Ravenheart arable, breathable, and livable. One only needs to follow the river a few miles southeast before seeing, far in the distance, the wind-scorched lands of the rest of the world, humid, scarred, and inhospitable.

      The Lifeweb is tended by the Mortii. The Mortii are rejects, outcasts, exiles, hunchbacks, and convicts.

      The tower has a door leading downwards.
  lifeweb:
    name: Lifeweb (Mortus)
    public: false
    secret: true
    tags: []
    description: |-
      The Lifeweb is a profoundly unintelligible piece of machinery within the Fortress's walls — a tower that, at its peak, spews the Life Fire. Although it also produces electricity, it is mainly prized for the Fire, which is said to be what keeps Ravenheart arable, breathable, and livable. One only needs to follow the river a few miles southeast before seeing, far in the distance, the wind-scorched lands of the rest of the world, humid, scarred, and inhospitable.

      The tower has a door leading downwards. Inside, levers control what parts of Ravenheart receive power. It also has a door which can be opened to reveal pistons, firing madly, witchfire green. There's a chair on a platform with complex implements. You can hook someone in, strap them down, align the machinery, cue the machine to speculate the vitrii, select the injection point, and decide whether you want some blood drawn — granting {tag:drained} and feeding the Lifeweb 20 points — or all the person's blood, feeding the Lifeweb 100 points but killing the donor.
  respawning:
    name: Respawning
    public: true
    tags:
      - Chaplain
      - Mortus
      - Dead
    description: |-
      When you die, you can rejoin at any time — but you'll be Cursed, meaning you can only start as a Bum or Migrant and you'll suffer a -6 penalty to your starting points.

      To rejoin as any other role, wait until your body is buried or your name is engraved. It's the Church and the Mortii's job to help souls pass on.

      A ghost has no voice. Your body speaks for you — while it lies unburied it stinks, and the place it is lying in keeps saying so.
  courtstructure:
    name: Court Structure
    public: false
    tags: []
    description: |-
      The Baron's rule is absolute. He has a small council including the Hand, the Meister, the Censor, and any other courtier he might assign.

      The Hand's the voice, the organizer, the executor. He outranks everyone except the Baron.
      The Meister collects taxes and provides medical attention.
      The Censor commands the Cerberon.

      The rest of the court, the Baron's family included, live their lives.
  cerberon:
    name: Cerberon
    public: false
    tags: []
    description: |-
      The Cerberon, along with the sheriff and the Order of the Silver Cross, is Ravenheart's single line of defense. It's led by the Censor.

      Every Cerberus has a {tag:disabler} (takes several shots; useful against unarmed people, but not someone who can run up to you and take it out of your hands), but otherwise relies on their armory. The Censor and the Incarn both have a key. The Fortress's yard also has an automated machine-gun turret. It shoots anything that moves. The switch to enable it is in the Censor's office.

      All Cerberi are expected to be, at minimum, functioning men. They are all loyal to the Baron. The Censor can freely fire, hire, and equip more Cerberi. Consider buying firearms from the Merchant.

      Cerberi also carry a {tag:radio-bracelet-cerberon}, which connects to the Censor's {tag:radio-system-cerberon}.

      **Your camp has an armory. While in camp, you may freely equip yourself with any weapon or armor from the Simple or Dead Simple tier (use the add tag menu).**
  postchristianity:
    name: Post-Christianity
    public: true
    tags: []
    description: |-
      Post-Christianity believes in God and Christ. Its doctrines are non-specific, as different people practice in different ways. However, there's a few commonalities:

      - The virtues are as important now as they ever were. The world is a dark place, but it still has room for goodness.
      - Christ never returned. The Earth was ruined, and we were left behind. It is our responsibility to redeem ourselves and await the afterlife.
      - There is a heaven, so we can endure anything that happens here — just remain pure.
      - There is also a hell, so we must protect others from descending into the spiritual darkness that's consumed the rest of the world.
  caving:
    name: Caving
    public: true
    tags: []
    description: |-
      The caverns around Ravenheart host all sorts of ancient dangers and treasures.

      The two underground regions are the caves and the depths. The caves are familiar to Ravenheart's more intrepid residents, while the depths descend inhospitably deep.

      Each movement from a location to another within the caves has a chance to trigger an encounter. These encounters vary significantly; you could find useful tools and valuables, or you could run into grave danger. Hunkering down in a single location reduces your chances of running into an unwanted encounter. Dangerous encounters triggered during a turn are deliberated at the end of the turn. You can still move locations after triggering one, but if you trigger more negative encounters, it will make your chance of survival far lower.

      You can do three things in the caves:

      - Roll encounters,
      - Use Gambits as normal, specifying whether you'd like to hunt a specific beast, scavenge for an item, or search a specific room.
      - Fulfill Quests, dangerous but rewarding opportunities that randomly appear in cave locations. This is where the true treasure can be found.

      You can also harvest {tag:cave-fungus} in just about every location (by doing a Gambit, or just through the encounter roll). The caves hold many secrets, requiring certain character traits or knowledge to gain access to.

  # The Merchant Update filled this in — it was an empty stub for as long as
  # the seat was unfinished. Reached by both The Company roles, so the
  # Dockers read it too: they are the ones hauling the goods. The canonical
  # numbers are docs/systemdocs/DEPOT.md §3-4; this is the player-facing
  # half and only carries the bands, never the full table.
  merchant:
    name: The Merchant's Depot
    public: false
    tags: []
    description: |-
      The Depot is open to anyone now. Your License still opens the whole manifest, sealed goods included; everyone else gets a shorter shelf gated by what they hold — the general shelf needs nothing, the black market wants a Silver Chip.

      Goods don't move the moment somebody pays. A cargo train runs every other day on its own. An order placed today lands as crates in the Railyard at the end of today or tomorrow, depending on where the train is — a Docker's job, or yours, to unload and haul on to the name stamped on the box. The Railyard is open to anyone, so a crate left there can walk.

      Whoever's selling drops the thing in the dropbox, and it's gone — the money lands when the train next leaves, into their own account or, with your License or a Depot Keycard, into yours. The Meister takes a cut off every sale before it settles, into the treasury.

      Prices hold to bands: a brew sells for close to what it cost to make plus a margin, smithed gear pays better the more skill and turns went into it, cave loot and bulk goods hold their price, and body parts stay cheap on purpose. The full table lives on the price list at the counter.

  charon:
    name: The Charon
    public: false
    secret: true
    tags: []
    description: |-
      The Charon is a one-way spaceship. It'll take its passengers out into space, where a passenger liner called the Leviathan is allegedly waiting for refugees. The Charon's hatch can be accessed through the Undercroft.
  # GM-only. The `gamemaster` flag is not a property of any Character — the
  # documents page resolves it against the Discord GM role at request time,
  # the same check that gates /gm. Filtered server-side, so a player's browser
  # never receives this text at all.
  cavingmonsters:
    name: Caving Monsters
    public: false
    tags: []
    flags:
      - gamemaster
    description: |-
      Some monsters to use in caving.

      **Nekkers**

      Weak, quadrupedal, ape-like scavengers. They eat corpses and can often be seen on the surface after battles, competing with the vultures. Killing one leaves a {tag:nekker-corpse}, which a {tag:butcher} can cut {tag:nekker-pheromones} out of.

      **Gragas**

      Dangerous, strong, hulking cave dwellers. Extremely slow, in part due to their overburdened leg muscles, which barely support them.

      Can be easily escaped. Killing them leaves a {tag:graga-corpse}, which a {tag:butcher} cuts a {tag:graga-sac} out of; that goes into {tag:graga-sweat} and the {tag:invisibility-potion}. The Merchant can sell Graga Sacs.

      **Skinless**

      Explorers and citizens of the caves. They travel alone or in packs, eventually returning to their communities in the **Aberrant Pits**. They rarely venture up into the Caverns. They used to be people. They can be talked down.

      Killing them leaves a {tag:skinless-corpse}; a {tag:butcher} cuts the {tag:skinless-brain} out of it, and that brain is the one ingredient in the {tag:dreamers-draught}. The Merchant can sell them. Note what that means: the Draught has a price, and the price is that somebody chose not to talk one down.

      **Aberrants**

      Horrors. Drop Aberrant Hearts.

  # GM-only, same mechanism as cavingmonsters. The answer sheet for every
  # recipe the hiding rule keeps off the public papers (a recipe naming a
  # non-public ingredient is hidden until the crafter holds one) — without
  # this, a GM asked "how is Pure Luck made?" would be reading tags.yaml.
  # Keep it current when a hidden recipe is added or an ingredient's
  # catalog: changes.
  withheldrecipes:
    name: Withheld Recipes
    public: false
    tags: []
    flags:
      - gamemaster
    description: |-
      Recipes hidden from the public papers and the Recipes tab. Each appears in a character's Craft menu only while they hold the ingredient — finding the thing is how the recipe is learned. Nothing here should be told to a player outright; place the ingredient instead.

      | Recipe | Skill | ⬢ | Needs | The ingredient comes from |
      |---|---|---|---|---|
      | {tag:white-honey} | Brewing II | 3 | {tag:honey} and {tag:trout-heart} | the Depot's shelf, 4 ⬢, and a rare fishing catch |
      | {tag:graga-sweat} | Brewing II | 2 | {tag:graga-sac} | butchered from a {tag:graga-corpse} |
      | {tag:invisibility-potion} | Brewing II | 2 | {tag:graga-sac} | butchered from a {tag:graga-corpse} |
      | {tag:dreamers-draught} | Brewing II | 6 | {tag:skinless-brain} | butchered from a {tag:skinless-corpse} |
      | {tag:pure-luck} | Brewing II | 0 | {tag:aberrant-heart} | cut from a fallen Aberrant, hunting the Depths |
      | {tag:raven-draught} | Brewing II | 2 | {tag:ravens-eye} | foraged while hunting |
      | {tag:honeyed-cakes} | Cooking II | 3 | {tag:honey} | the Depot's shelf, 4 ⬢ |
      | {tag:graga-hide-cloak} | Crafting | 6 | {tag:graga-sac} | butchered from a {tag:graga-corpse} |
      | {tag:minted-charm} | Smithing I | 15, 3-turn project | {tag:old-coin} | caving loot |
      | {tag:musk-lure} | Butcher | 2 | {tag:nekker-pheromones} | butchered from a {tag:nekker-corpse} |
      | {tag:autoinjector} | Brewing III | 3, 1 turn | {tag:antidote}, {tag:fever-draught} and {tag:brackenmoss} | foraged — GM-granted until the loot pass wires it |
      | {tag:last-breath} | Brewing III | 12, 3-turn project | {tag:aberrant-heart} | a fallen Aberrant — GM-granted until the loot pass wires it |
      | {tag:cybernetic-arm}, {tag:cybernetic-leg} | Brewing III | 16, 3-turn project each | {tag:cybernetic-core} | GM-granted only, nothing drops it yet |
      | {tag:chrism} | Blessing | 2 | {tag:holy-water} and {tag:honey} | the Cathedral's still and the Depot's shelf |
      | {tag:heartforged-blade} | Smithing II | 34, 3-turn project | {tag:aberrant-heart} | cut from a fallen Aberrant, hunting the Depths |
      | {tag:death-mask} | Artist | 4, 2-turn project | a corpse (kept) and {tag:saltpeter} | hidden by its own catalog flag, like the {tag:bone-mask}: an artist standing with a body finds it |

      The {tag:lavish-meal} also takes {tag:honey} as an unlisted delicacy — a cook holding a jar sees the option; the public paper names tea, sweets and fish roe, but never honey.

      Mechanics a GM adjudicates or should know: the {tag:blessed} status a {tag:chrism} grants blocks Break-family grants outright and halves everything that sinks the mood for 3 turns; an equipped {tag:heartforged-blade} stops the mood sinking at all and fights as Exceptional; a held {tag:musk-lure} is auto-spent to negate its holder's first cave TROUBLE; an equipped {tag:minted-charm} adds +1 to Learn Skill rolls; a {tag:death-mask} can be taken ONCE per corpse — the body's description says when a face is gone — and the finished mask is named for the dead.

  # The Demoness threat's own brief (db/lib/threats.js). Assigned by the
  # Demoness tag, which is also what unlocks the hidden Demoness tag
  # category — so the paper and the powers arrive together.
  demoness:
    name: Demoness
    public: false
    secret: true
    tags:
      - Demoness
    description: |-
      You are a being from the Caves. You have been alive for a long time, but your memory is fuzzy.

      You don't need to eat. Instead, you live for the thrill of enslaving souls, manipulating people, and causing pain. You will become unhappy if you don't.

      You can Break souls — see {tag:demoness}. If you have {tag:slavemaster}, they become {tag:broken-enslaved} instead of merely {tag:broken}.

      You find normal crosses tacky and boring. Fire scares you somewhat — it definitely hurts. The Silver Cross, on the other hand, terrifies you. If you touch it, your powers are disabled for the rest of the day.

      There may be people in the area who want to use your power. They'll take your treasured independence — the demented, servile idiots.

  # Referenced by roles via doc_elements but not yet written. Stubs keep the
  # reference resolvable (same posture as Guard Duty above) — fill in the
  # description when the content is ready.
  armory:
    name: The Armory
    public: false
    tags: []
    description: ""
  inn:
    name: The Inn
    public: false
    tags: []
    description: ""
  farming:
    name: Farming
    public: false
    tags: []
    description: ""
  thepusher:
    name: Pusher
    public: false
    tags: []
    roles:
      - pusher
      - cerberus
      - baron
      - hand
    description: |-
      The Pusher sells drugs and runs the town's gambling den in the Abandoned Theater. It's his job to keep the peasants satisfied and not rebelling.

      He's exempted from the usual capital punishment for drug possession, but he owes the Baron a cut.
  squeeze:
    name: Squeeze
    public: false
    tags: []
    roles: [banneret, baron, merchant, hand, meister]
    description: |-
      A pink substance with similar but less exotic properties to the {tag:skinless-brain}. These are very valuable across Earth.

      The Baron highly values the Banneret's work on the Squeeze, as it singlehandedly funds Ravenheart's warchest. Squeeze has no use for anyone in Ravenheart, but without its production, Ravenheart wouldn't be able to grow at all. Its production is very dangerous.

      Squeeze sells for 7 ⬢ at the Merchant's Depot. The Merchant has, in the past, traditionally taken 1 or 2 ⬢ per, leaving the Banneret with 5 or 6 per cube.
  godardfactory:
    name: Godard Factory
    public: false
    tags: []
    factions: [the-factory]
    description: |-
      Godard's beauty days are over, but it still functions. The Banneret's lineage, one of the Baron's cadet houses, has (usually grudgingly) employed refugees to extract {tag:godflesh} from the marshes and refine it into {tag:squeeze}, which is then shipped off to the merchant. It is generally unknown what Squeeze does or why it's so valuable. Unfortunately, due to the working conditions, most refugees don't stay for long and usually try to make it to the town. They're easily replaced, so it doesn't matter.

      Anyone with a hatchet or chainsaw equipped can obtain Godflesh by pressing the Harvest Godflesh button from the character panel while in a marsh wilderness location. You can only do it once per turn. To turn it into {tag:squeeze}, press Refine while in the factory. You must have Godflesh in your inventory or somewhere in the factory. You will then obtain eight Squeeze cubes. Crate these up and load them into a cart!

      Extracting is dangerous, because the Godflesh is a living thing with swarming mouths that try to eat you. You run a risk of getting wounded. On the upside, working at the Factory gives you a chance of social mobility — a good Banneret will pay you much more than the average commoner would make, if only to keep you around.

  # Granted two ways on purpose: by the Elevator Key tag, so anyone who ends up
  # holding one learns what it opens, and by role to the Baron (whose secret it
  # is) and the Tribune (who is not given a key but is told the way in). The
  # Ordinator needs no role entry — they carry the key, so the tag covers them.
  elevatorkey:
    name: Elevator Key
    public: false
    secret: true
    tags:
      - Elevator Key
    roles: [tribune, baron]
    description: |-
      The Undercroft has an elevator which connects it to the nearby Cliffside Road.

  # THE THANATI (docs/systemdocs/THANATI.md). Bascinet's text, verbatim; the
  # only edits are the {tag:…} tokens, which the source wrote as {Name}.
  cultist:
    name: Cultist
    public: false
    tags:
      - Thanati
    description: |-
      This reality is flawed to its core! Lord Tzchernobog will deliver a new, perfect reality once this one has come to an end, when the last human observer has passed into nothingness.

      You and your fellow cultists must obey the instructions of your leader and ultimately, Tzchernobog. You can see who your fellow cultists are in the faction tab.

      Secrecy is your greatest strength. Ever since the arrival of the Inquisitor, the cults position has been tenuous. The capture of one of you will result in your exposure, death is preferable to what the sadistic inquisition will do to you.

      You may retrieve your {tag:black-robes} and {tag:thanati-mask} at any time while in Ravenheart, by spending an action. You must wear them to perform rites, and use cursed items. Be careful, they give away your position as a heretic when worn.

      You can see your fellow members by using the **Recall Comrades** button.

      You can craft Flesh of Tzchernobog using 1 resource. Consume it in order to conduct rites.

      You can craft the {tag:grimoire} using 1 {tag:blank-book}. It will detail the available rites and their words of corruption.

      Seek to meet up with your cult leader and commence the initial rite. It will let you hear the bidding of Lord Tzchernobog.

      Your cult has a hideout somewhere in Ravenheart, here you can stockpile resources and items. You may also purchase illicit goods here, see the Thanati Network document for more information.

      Victory is to complete all, or as many objectives as possible. From there, you will be rewarded, even if you die.
  rites:
    name: Rites
    public: false
    tags:
      - Thanati
    description: |-
      The list of rites and their words can be obtained by crafting a {tag:grimoire}, which takes 1 {tag:blank-book}. To fulfill a rite, consume a {tag:flesh-of-tzchernobog} to gain {tag:dark-inspiration} and then prepare the ingredients — hold them or set them on the ground where you plan to commence the rite. You must then chant the Word of the Circle in a conversation or in the room. To account for time zones, you have twelve hours to meet the requirements after beginning. Once completed, you have an extra minute for any other cultists who wish to join in the chanting.
  cult-leader:
    name: Cult Leader
    public: false
    tags:
      - Thanati Leader
    description: |-
      You have emerged as the leader of Ravenheart's cell of Thanati. They will follow your every order, and you must lead them to accomplish the Dark Lords instructions.

      You are the brains behind all the cults schemes. If you are captured, the entire cult will be in jeopardy. Have your underlings perform the riskiest of tasks instead.

      You oversee management of the cults resources and stockpile. Equip your cultists however you see fit.

      Your presence is required for the most important rites. Good luck.
  # Readable by the cult and by the two religious factions — the Church and
  # the Order — through `roles:`, the same way elevatorkey reaches the Baron.
  thanati:
    name: Thanati
    public: false
    tags:
      - Thanati
    roles: [bishop, chaplain, scholastic, inquisitor, practicus, preacher]
    description: |-
      The Thanati are a violent death cult, seeking to bring an end to this reality. In their eyes it is flawed and broken, and must be torn down so that their lord, Tzchernobog can rebuild it anew. Only when the last human observer ceases to exist can this reality end.

      In recent times, the local Thanati cell was expanding throughout Ravenheart, threatening to upend the entire region. As such, the inquisition was dispatched to purge Ravenheart of the sin that had come to fester beneath the surface.

      Thanati cultists can be identified by their dark robes, heretical chants and burning hatred for the Post-Christian church. Due to the presence of the inquisition, the members have gone into hiding, however they are far from idle. The cult will conduct secretive sigils in the dark corners of the fortress, communing with their dark lord.

      **Common Thanati Chants:**

      "Crudux Cruo!"

      "Geroxe bibox malax!"

      "Geroxe Cruo!"

      "Maranax infirmux!"

      These chants allegedly commune with Tzchernobog, granting his servants strength as they conduct his bidding.
  thanati-network:
    name: Underground Thanati Network
    public: false
    tags:
      - Thanati
    description: |-
      The Thanati have cells established all over the planet, and maintain close logistical connections. Cultists may access the network while in their hideout, exchanging resources for equipment. Generally, only the cult leader is permitted to handle the ordering of equipment.
  # The Grimoire's body is GENERATED, never authored here: /documents expands
