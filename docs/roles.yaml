      the-town:
        name: The Town
        silo: square-warehouse
        roles:
          headman:
            name: Headman
            intro: >-
              Lead the Town. Ensure it works and pays its taxes.
            description:
              - >-
                On certain days, you hike up the mountain and behold the Town. Those are the people that are beholden to you. You cannot afford to let them down, Headman!
              - >-
                Your main job is to tax people. You are beholden to the Meister, the Baron's taxperson, and things have gotten nasty in the past when the tithe didn't meet expectations. If the Silo's not full next time he comes, it won't be a pretty day. You also ought to pay tithe to the Church, for all they do for the town, and pay the Sheriff, for their work.
            difficulty: hard
