            intro: >-
              Sell your sword or delve into the caves for pay.
            description:
              - >-
                You're not under anyone's payroll. It's therefore your responsibility to provide for yourself. There's a few ways to do that: selling your sword to someone; or going into the caves, retrieving items of value, and selling it to the Merchant or the Sanctuary. Trust me, the Sanctuary loves cave fungus!
