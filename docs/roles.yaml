  - name: Marshes
    factions:
      the-factory:
        name: The Factory
        # Godard is one of the Baron's cadet houses, which is the whole
        # reason the money goes up to the Keep rather than staying here.
        parent: The Court
        silo: factory-logistics-room
        roles:
          banneret:
            name: Banneret
            intro: >-
              As the Baron's cousin, begrudgingly serve Ravenheart by organizing the production of the valuable Squeeze and selling it to the merchant.
            description:
              - >-
                You are one of Ravenheart's cadet houses, carrying only a fraction of the prestige and responsibility.
              - >-
                You have been charged with Godard Factory. While usually looked down upon as a piece of marsh scum, it is very valuable: Squeeze is how Ravenheart obtains obols, functionally funding its warchest.
              - >-
                Your whole operation relies on your communication with the merchant and the Keep. It's your job to crate the Squeeze, load it on the cart, and sell it to the merchant — or you can let the Geschef do it. But make sure you're getting a good price. Keep some to pay your employees and give the rest to the Baron, lest the Watch come knocking.
              - >-
                Keep your refugees happy with {tag:moonshine}, but also by paying them fair wages. They should make more than commoners — after all, you can afford to pay them. Or just don't pay them and keep them in line.
              - >-
                Make sure everyone's wearing their armored gloves. So many hands lost. Oh, and emphasize to your workers — do not eat the Squeeze! You can't afford to repeat what happened last time…
              - >-
                There's a fisherman a couple miles north and obols in your office to pay him. Keep him around so he keeps feeding the Factory.
            difficulty: hard
            multiple: false
            starting_resources: 4
            starting_zone: marshes
            starting_location: factory
            leader: true
            whitelist: true
            starting_tags:
              - Ravenhearter
              - Horse
              - Cart
              - Nobility
              - Brigandine
              - Sabre
              - Bore Pistol
              - Melee (Basic)
              - Ranged (Basic)
              - Armored Gloves
              - Factory Key
              - Banneret's Key
              - Appraisal
            doc_elements:
              - godking
              - godardfactory
              - squeeze
              - ravenhearteconomy
          geschef:
            name: Geschef
            intro: >-
              Organize operations while the Banneret goes to see the merchant. If the refugees get rowdy, hit them with a stick.
            description:
              - >-
                Your whole operation relies on your communication with the merchant and the Keep.
              - >-
                You've survived this operation long enough to become the general manager. A good place to be. You can treat some of the wounds that will surely come and brew the workers Moonshine to keep them happy.
              - >-
                Make sure everyone's wearing their armored gloves. So many hands lost. Oh, and emphasize to your workers — do not eat the Squeeze! You can't afford to repeat what happened last time…
              - >-
                There's a fisherman a couple miles north and obols in your office to pay him. Keep him around so he keeps feeding the Factory.
            difficulty: normal
            multiple: false
            starting_resources: 4
            starting_zone: marshes
            starting_location: factory
            starting_tags:
              - Ravenhearter
              - Tough
              - Old
              - Big Appetite
              - Cudgel
              - Padded Armor
              - Melee (Basic)
              - Brewing (Basic)
              - Medical (Basic)
              - Cooking (Basic)
              - Cleaning Powder
              - Armored Gloves
              - Factory Key
              - Banneret's Key
              - Appraisal
            doc_elements:
              - godardfactory
              - medical
          refugee:
            name: Refugee
            intro: >-
              Do dangerous work — cutting Godflesh from the marshes — in exchange for good hazard pay and potential social mobility.
            description:
              - >-
                You arrived from the caves. You don't really have a trade or the ability to labor, so your only opportunity to stay alive is through factory work.
              - >-
                Cutting Godflesh out is dangerous. However, since it's worthwhile as it is to the merchant, the Banneret should be paying you well. If that's not the case, feel free to do a bit of protesting.
              - >-
                But not too much, you know? Your life is worthless here. And an armed revolt? Pffft.
            difficulty: easy
