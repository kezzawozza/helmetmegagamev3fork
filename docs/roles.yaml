# Source of truth for every playable role/faction, synced into
# Postgres by db/lib/syncRoles.js#syncRolesFromYaml (npm run db:sync-roles).
#
# PROSE STYLE — every prose value in this file (`intro`, each `description`
# bullet) is a `>-` folded block scalar, one physical line per bullet, no
# hard wrapping. `>-` never needs quoting, so a `: ` or a leading `-` inside
# the text is safe, and it folds back to a single line. That last part is
# load-bearing: `Role.description` is a String[] and each element is rendered
# as one Markdown bullet on the role charter, so an element carrying a newline
# breaks the bullet. Never use `|` on `description` — it hands the sync one
# string where Prisma wants an array, and the sync throws mid-pass with the
# factions already written.
# docs/locations.yaml follows the same rule.
#
# Factions and roles are maps keyed by slug (`baron:`, not `- slug: baron`);
# `zones:` stays a sequence, since a zone here carries only a name. See
# docs/tags.yaml's header for why, and db/lib/yamlEntries.js.
#
# `slug` is the stable match key across syncs, on both factions and roles —
# same contract as docs/locations.yaml's `id` and docs/tags.yaml's `slug`.
# Renaming later means changing `name`, NOT `slug`; a changed slug is treated
# as a brand-new row (old one pruned) rather than a rename.
#
# Threats — Sympathizer, the Demoness, the Judge — are
# NOT in this file. They were never read by any sync (a GM hands those seats
# out by hand and they never appear in the player-facing picker), so the whole
# brief lives in db/lib/threats.js instead (docs/systemdocs/THREATS.md).
#
# The Brigands are the exception, and used to be listed here as a threat too:
# they ARE in this file, with weights, so they sync like any other faction and
# do appear in the picker. Nothing in db/, web/ or bot/ special-cases them.
# They sit in the Town zone — their roles start in the Forest, which is a Town
# location, and under the Silo reach rules (FACTIONS.md) a faction's zone is
# where its Silo is. Town robbers bank in Town.
#
# `weight` (only present on `multiple: true` roles) is the seat cap,
# expressed as seats allowed per 100 total players — the picker computes
# `round(weight * GameConfig.playerCount / 100)`, so raising playerCount to
# 120 scales every capped role by 1.2. `weight: unlimited` means no cap at
# any scale (chaff roles like Commoner/Migrant).
#
# `multiple: false` roles get no `weight` field at all — they're a single
# specific named character (Baron, Bishop, Headman, ...) and always stay
# at exactly one seat no matter how large the game gets, which is not the
# same thing as "1 per 100 players".
#
# A seat normally frees up when its holder dies. The roles that DON'T reopen
# (Baron, Heir, Bishop, the Brigands, ...) are listed in
# code — db/lib/roleCapacity.js#PERMANENT_SEAT_ROLE_SLUGS, by slug — not here.
#
# `leader: true` / `treasurer: true` set Character.isLeader/isTreasurer at
# creation. These were once entries in `starting_tags`, but Leader and
# Treasurer are plain booleans on Character, not Tags (see
# docs/systemdocs/TAGS.md §6).
#
# `whitelist: true` is a SEPARATE thing, and used to be the same thing: who
# may claim this seat at all. Picking a whitelisted role needs the @Leader
# Whitelist Discord role (db/lib/roleIds.js), always — that used to be a Dev
# Panel switch and is now simply the rule. It rode on `leader:` until
# the two were split, which conflated a hosting decision with a faction
# mechanic — the Baron HAS to lead the Court whether or not his seat is gated,
# and the Hand and the Arbiter are gated without leading anything. Every
# `leader: true` role is also whitelisted today, but that is a choice, not a
# rule: set both, independently.
#
# `starting_resources` (role-level) is how many Resources that character
# starts play with. A faction's Silo is not listed here: its opening balance
# is computed at seed time from the weights of the faction's roles — see
# db/lib/factionSilo.js.
#
# `starting_zone` (role-level) is a Zone **slug** from docs/zones.yaml — it
# decides where the character starts, and therefore which zone role (and so
# which Discord category) they get on creation. Must be a presence zone: the
# Caves group itself is not standable, but its levels (caverns, railroad,
# aberrant-pits) are.
#
# `silo` (faction-level, optional) is a Room **slug** from docs/zones.yaml —
# the room this faction banks in. CREATE-ONLY, exactly like `parent:` below:
# it seeds the pointer when the faction row is first written and is never
# re-applied, because a Leader or Treasurer re-points their own silo in play
# and a re-sync must not drag it back. See docs/systemdocs/FACTIONS.md.
#
# `starting_location` (role-level, optional) is a Location **slug** from
# docs/zones.yaml — it decides which Location channel (and "Location: {Name}"
# role) the character lands in. If a role gives none, it defaults to the
# first Location (by `sort`) of its `starting_zone`. If both are given, the
# location must actually belong to that zone — the sync throws otherwise.
#
# `starting_tags` are Tag names from docs/tags.yaml, granted free at
# creation on top of whatever the player buys with points. The sync throws on
# any name not in the catalog, so a typo can't silently ship a character
# missing tags.
#
# `extra_starting_points` (optional, defaults 0) is added to
# GameConfig.startingTagPoints to form that role's point-buy budget.
zones:
  - name: Fortress
    factions:
      the-court:
        name: The Court
        silo: servants-storehouse
        roles:
          baron:
            name: Baron
            # The seat fixes the holder's gender -> Role.lockedGender.
            gender: MAN
            intro: >-
              You are the Baron of Ravenheart. Lead the people to peace, justice, and prosperity and walk the path of your ancestors.
            description:
              - >-
                You are the ruler. Your job isn't an easy one.
              - >-
                Choose a last name — a Dynasty name. Ensure that if you die, at least your heir will continue on.
              - >-
                Whether you understand the gravity of the situation or live in perpetual dissociation, you are charged with the survival of one of Earth's last bastions. This is Ravenheart — a garden, a home. Your ancestors strove to protect it. Some will see you as a dictator, some will see you as a fool — it does not matter! This will outlive you, outlive them!
              - >-
                Stay happy. An unhappy Baron is an unproductive, dangerous baron.
              - >-
                The Council Room has an intercom. Anyone standing at that table can speak into it, and everyone above ground will hear — except the Black Hills, which no speaker was ever strung out to. The yard also has an automated machine gun turret which can be turned on from the Censor's office. It can't tell hostiles or friendlies apart.
              - >-
                You have three missions:
              - >-
                Be organized. Communicate, force your Hand to work, check in on people.
              - >-
                Above all, be proactive. Ravenheart is a dangerous place. If you prepare well, you may keep away the darkness…
              - >-
                Win people's loyalty. If your people trust and follow you, there is no danger you cannot overcome.
              - >-
                Eventually you will be attacked by the Bastard. Besides your personal investment, it's clear that that man cannot be allowed to rule Ravenheart. The visionary that he is — he would lose it all. Ravenheart's survival is a delicate balance, one he cannot possibly hope to ever understand.
              - >-
                A note: there is a trapdoor in the throne room that drops into a dark pit. There's a Graga there, a true monster.
              - >-
                The town's labor feeds Ravenheart but doesn't produce any surplus. Its true economic surplus comes from Godard Factory's production of Squeeze. Keep close communication with the Banneret to ensure he's getting you enough obols to fund the warchest, and buy you nice things from the merchant.
            difficulty: hard
            multiple: false
            starting_resources: 5
            starting_zone: fortress
            starting_location: keep
            extra_starting_points: 7
            leader: true
            whitelist: true
            starting_tags:
              - Armory Key
              - Ravenhearter
              - Nobility
              - Cerberus Key
              - Baron's Key
              - Elevator Key
              - Baron's Scepter
              - Brigandine
              - Sabre
              - Literate
              - Courtier
              - Obol x25
              - Post-Christian
              - Appraisal
            doc_elements:
              - godking
              - squeeze
              - courtstructure
              - lifewebbasic
              - cerberon
              - armory
              - ravenhearteconomy
              - charon
          baroness:
            name: Baroness
            # The seat fixes the holder's gender -> Role.lockedGender.
            gender: WOMAN
            intro: >-
              Assist the Baron as only someone who loves him can. Raise and protect the Heir, and be the Mistress of the Keep.
            description:
              - >-
                Your Baron is a stressed, overburdened, and threatened man. You do not understand everything, but he has a project. Ravenheart is one of humanity's last bastions. Do what you can to protect him — and the Heir.
            difficulty: easy
            multiple: false
            starting_resources: 1
            starting_zone: fortress
            starting_location: keep
            starting_tags:
              - Ravenhearter
              - Courtier
              - Nobility
              - Jewelry
              - Literate
              - Baroness's Key
              - Obol x5
              - Post-Christian
            doc_elements:
              - godking
              - courtstructure
              - lifewebbasic
          heir:
            name: Heir
            # The seat fixes the holder's gender -> Role.lockedGender.
            gender: MAN
            intro: >-
              You are your father's son. Are you the exact opposite of him, or his closest ally?
            description:
              - >-
                Life is good as the Heir — but that may change one day. Will you make an effort to reveal the gravity of your situation, or will you dawdle your days away?
            difficulty: easy
            multiple: false
            starting_resources: 1
            starting_zone: fortress
            starting_location: keep
            extra_starting_points: 5
            starting_tags:
              - Ravenhearter
              - Courtier
              - Nobility
              - Literate
              - Heir's Key
              - Obol x5
              - Post-Christian
            doc_elements:
              - godking
              - courtstructure
              - lifewebbasic
          successor:
            name: Successor
            # The seat fixes the holder's gender -> Role.lockedGender.
            gender: WOMAN
            intro: >-
              You are the Baron's daughter. Bring some light to the darkness.
            description: []
            difficulty: easy
            multiple: false
            starting_resources: 1
            starting_zone: fortress
            starting_location: keep
            starting_tags:
              - Ravenhearter
              - Courtier
              - Nobility
              - Jewelry
              - Literate
              - Successor's Key
              - Post-Christian
            doc_elements:
              - godking
              - courtstructure
              - lifewebbasic
          hand:
            name: Hand
            intro: >-
              You're the Baron's best friend and perhaps the only man he can truly trust. At his side, shape the course of Ravenheart for the better.
            description:
              - >-
                The Baron works best when he's informed and has a court that's loyal and organized. You are his everloyal spymaster, executor, and voice. Without you, Ravenheart may very well collapse.
              - >-
                Whether you understand the gravity of the situation or live in perpetual dissociation, you are charged with the survival of one of Earth's last bastions. This is Ravenheart — a garden, a home.
              - >-
                You have three missions:
              - >-
                Be organized. Communicate, check in on people. Execute the Baron's vision. In order to do these things, you must win people's loyalty. If the people trust and follow you, there is no danger you cannot overcome.
              - >-
                Above all, be proactive. Ravenheart is a dangerous place. If you prepare well, you may keep away the darkness…
              - >-
                Eventually you will be attacked by the Bastard. Besides your personal investment, it's clear that that man cannot be allowed to rule Ravenheart. The visionary that he is — he would lose it all. Ravenheart's survival is a delicate balance, one he cannot possibly hope to ever understand.
              - >-
                A note: there is a trapdoor in the throne room that drops into a dark pit. There's a Graga there, a true monster.
              - >-
                The town's labor feeds Ravenheart but doesn't produce any surplus. Its true economic surplus comes from Godard Factory's production of Squeeze. Keep close communication with the Banneret to ensure he's getting you enough obols to fund the warchest, and buy you nice things from the merchant.
            difficulty: normal
            multiple: false
            starting_resources: 1
            starting_zone: fortress
            starting_location: keep
            extra_starting_points: 7
            treasurer: true
            whitelist: true
            starting_tags:
              - Armory Key
              - Ravenhearter
              - Courtier
              - Literate
              - Hand's Pin
              - Hand's Key
              - Elevator Key
              - Obol x10
            doc_elements:
              - godking
              - squeeze
              - courtstructure
              - lifewebbasic
              - courtier
              - cerberon
              - armory
              - ravenhearteconomy
              - charon
          meister:
            name: Meister
            intro: >-
              You are the Keep's brains, but more importantly, its circulatory system. Organize the various systems of Ravenheart and ensure the economy remains in order.
            description:
              - >-
                Make sure the Town sends its taxes — your main contact there is the Headman — and oversee that no one is taking undue amounts of Resources from the Silo. The town's labor feeds Ravenheart but doesn't produce any surplus. The true money to be made comes from Godard Factory's production of Squeeze. Keep close communication with the Banneret to ensure he's getting you enough obols to fund the warchest, and buy you nice things from the merchant.
              - >-
                Your part in fate is not well-loved nor well-understood, but it is essential. You bear the weight of Ravenheart on your shoulders — or that's what it seems like to you.
              - >-
                In order to do your job effectively, communication and coordination is key. You can use the Keep's messenger ravens to contact others over long distances, and should consider keeping records of the events of the day, to be referenced down the line.
              - >-
                A note: there is a trapdoor in the throne room that drops into a dark pit. There's a Graga there, a true monster.
            difficulty: normal
            multiple: false
            starting_resources: 2
            starting_zone: fortress
            starting_location: keep
            treasurer: true
            whitelist: true
            starting_tags:
              - Ravenhearter
              - Courtier
              - Frail
              - Medical (Basic)
              - Literate
              - Meister's Key
              - Bird
              - Obol x5
              - Taxman
            doc_elements:
              - godking
              - squeeze
              - courtstructure
              - lifewebbasic
              - courtier
              - medical
              - ravenhearteconomy
          arbiter:
            name: Arbiter
            intro: >-
              Represent the God-King Enoch II's interests, support Ravenheart's defense, and advise the Baron.
            description:
              - >-
                You are not a born citizen of Ravenheart, unlike the rest of these people. Your home and allegiance is back in the Kingdom, and as such, you are here to serve His Majesty God-King Enoch II's interests — primarily by ensuring neither Ravenheart's court nor its peasants get uppity, and secondarily by aiding in the organization of its defenses against both internal and external threats. Whether you happen to personally like the Baron or not is up to you.
              - >-
                Unless the God-King orders you otherwise, ensure you're helping the fortress however you can. It is particularly important that you aid in economic matters, such as in the organization of Godard Factory or the town's taxation. Ensure the Meister and the Headman do their jobs.
              - >-
                Ask the Baron how you can help him. Your service will surely be appreciated.
            difficulty: normal
            multiple: false
            whitelist: true
            starting_resources: 2
            starting_zone: fortress
            starting_location: keep
            starting_tags:
              - Ravenhearter
              - Literate
              - Sabre
              - Major's Insignia
              - Obol x4
              - Appraisal
            doc_elements:
              - godking
              - courtstructure
              - ravenhearteconomy
          courtier:
            name: Courtier
            intro: >-
              Live life indulgently or honorably — there is not much binding you except your own decisions. What freedom!
            description:
              - >-
                For whatever reason, the Baron keeps you around in his court. Convince the Censor to launch an expedition into the caves, host marvelous feasts, or duel your fellow courtiers for the Successor's affection. It is your day to make of it what you will.
              - >-
                As a Courtier, your gameplay is largely undefined. You are encouraged to set your own goals and desires and work to fulfill them.
            difficulty: easy
            multiple: true
            weight: 6
            starting_resources: 1
            starting_zone: fortress
            starting_location: keep
            starting_tags:
              - Ravenhearter
              - Courtier
              - Literate
            doc_elements:
              - godking
              - courtier
              - courtstructure
          minstrel:
            name: Minstrel
            intro: >-
              Compose ballads, smuggle drugs from the Town, and keep the Baron happy.
            description:
              - >-
                Peddle what you smuggle to the courtiers — quietly.
            difficulty: easy
            multiple: true
            weight: 1
            starting_resources: 1
            starting_zone: fortress
            starting_location: keep
            starting_tags:
              - Ravenhearter
              - Musician
              - Instrument
            doc_elements:
              - godking
              - courtier
              - courtstructure
          servant:
            name: Servant
            intro: >-
              Keep the fortress running.
            description:
              - >-
                Clean, cook, maintain, and serve.
              - >-
                Take Cooking (Skilled) if you want to run the kitchens properly as the Chef.
            difficulty: easy
            multiple: true
            weight: 3
            starting_resources: 1
            starting_zone: fortress
            starting_location: servant-wing
            starting_tags:
              - Ravenhearter
              - Servant
              - Cooking (Basic)
            doc_elements:
              - godking
              - courtier
              - courtstructure
      cerberon:
        name: Cerberon
        silo: garrison-mess-hall
        parent: The Court
        roles:
          censor:
            name: Censor
            intro: >-
              Bravely lead the Cerberi against the enemies of Ravenheart.
            description:
              - >-
                Ravenheart is an ancient bastion of humanity and a beacon of light. It is your solemn duty — at least on paper — to uphold that.
              - >-
                You win through leadership, proactivity, communication, and organization. Think carefully. Speak with the Baron. Do not ride into battle unless necessary — be a strategist first, a footsoldier second. Always be a step ahead of the darkness. If you have eyes everywhere, plans, if you know and see, nothing can stop you.
              - >-
                The Cerberi are men, but they are also dogs. Remind them that in service of Ravenheart, they should be capable of the savagery their position demands.
            difficulty: hard
            multiple: false
            starting_resources: 1
            starting_zone: fortress
            starting_location: garrison
            leader: true
            whitelist: true
            treasurer: true
            starting_tags:
              - Censor's Helmet
              - Armory Key
              - Cerberus Key
              - Censor's Key
              - Ravenhearter
              - Cerberon
              - Tactician
              - Melee (Trained)
              - Melee (Shield Wall)
              - Ranged (Basic)
              - Teaching
              - Disabler
              - Truncheon
              - Broadsword
              - Shield
              - Radio System (Cerberon)
              - Radio Bracelet (Cerberon)
              - Literate
              - Obol x2
              - Post-Christian
            doc_elements:
              - godking
              - courtstructure
              - cerberon
              - armory
              - combat
          incarn:
            name: Incarn
            intro: >-
              You are a warrior monk, the Warden, the unbound spirit of the Keep.
            description:
              - >-
                Guard the Keep, process prisoners, pray to God, and guard the Silver Cross. Your allegiance is to God first and foremost, and Ravenheart second. Fortunately, the Baron is on the side of order more often than not, so your cause tends to be aligned with his. Do not stoop to the madness of passion, Incarn. Be resolute, quiet, and powerful.
              - >-
                Your job is to guard the dungeon, process migrants, and protect the Silver Cross, Ravenheart's only relic. The Silver Cross is an ancient artifact. It terrifies and burns demonic creatures.
              - >-
                Your role is as organizational as it is combat-like — you should assist the Censor in assigning his men, drafting battleplans, and performing espionage. Monitor the outskirts and the caves, hire a messenger — always be a step ahead of the darkness.
            difficulty: normal
            multiple: false
            starting_resources: 2
            starting_zone: fortress
            starting_location: garrison
            treasurer: true
            starting_tags:
              - Armory Key
              - Ravenhearter
              - Melee (Trained)
              - Ranged (Basic)
              - Cerberon
              - Cerberus Key
              - Melee (Shield Wall)
              - Pious
              - Incarn's Key
              - Cudgel
              - Disabler
              - Mail Coif
              - Mail Shirt
              - Post-Christian
            doc_elements:
              - courtstructure
              - cerberon
              - postchristianity
              - armory
              - combat
          cerberus:
            name: Cerberus
            intro: >-
              Serve the Baron and defend Ravenheart. You are the man of the hour.
            description:
              - >-
                You are a member of the Cerberon, one of the prowling dogs of the Keep. Armed with your disabler, cudgel, and your weapon of choice from the armory, execute the Censor's will.
              - >-
                You are loyal to the Censor and the Baron, although extreme circumstances could change that.
            difficulty: easy
            multiple: true
            weight: 6
            starting_resources: 1
            starting_zone: fortress
            starting_location: garrison
            starting_tags:
              - Cerberus Helmet
              - Ravenhearter
              - Cerberon
              - Cerberus Key
              - Melee (Basic)
              - Ranged (Basic)
              - Melee (Shield Wall)
              - Disabler
              - Radio Bracelet (Cerberon)
              - Truncheon
              - Mail Coif
              - Mail Shirt
              - Post-Christian
              - Obol x1
            doc_elements:
              - courtstructure
              - cerberon
              - armory
              - combat
          squire:
            name: Squire
            intro: >-
              Train. One day, you might become a knight.
            description: []
            difficulty: easy
            multiple: true
            weight: 2
            starting_resources: 1
            starting_zone: fortress
            starting_location: garrison
            starting_tags:
              - Ravenhearter
              - Cerberon
              - Cerberus Key
              - Cudgel
              - Simple Helm
              - Buckler
              - Mail Coif
              - Mail Shirt
              - Post-Christian
            doc_elements:
              - courtstructure
              - cerberon
              - armory
              - combat
  - name: Town
    factions:
      the-church:
        name: The Church
        silo: cathedral-pantry
        roles:
          bishop:
            name: Bishop
            intro: >-
              Keep people's souls on the straight and narrow. Prevent the world from descending into animalness.
            description:
              - >-
                It's not the first time dark days have come to Ravenheart; God will ensure the people survive. Your task is to serve as a shining example of goodness during the transition.
              - >-
                At some point, you'll have to decide between peacefulness or the Order of the Silver Cross.
              - >-
                You can make Holy Water.
              - >-
                Along with the Chaplains, you have the power to take confessions, dispelling psychological drawback tags.
            difficulty: normal
            multiple: false
            starting_resources: 1
            starting_zone: town
            starting_location: cathedral
            leader: true
            whitelist: true
            starting_tags:
              - Cathedral Key
              - Ravenhearter
              - Chaplain
              - Blessing
              - Teaching
              - Pious
              - Literate
              - Post-Christian
              - Bishop's Mitre
              - Vestments
              - Cross
            doc_elements:
              - townstarting
              - postchristianity
              - church
              - ravenhearteconomy
          chaplain:
            name: Chaplain
            intro: >-
              Care for the needy, lend an ear, and kindle goodness in others.
            description:
              - >-
                It's not the first time dark days have come to Ravenheart; God will ensure the people survive. Your task is to serve as a shining example of goodness during the transition.
              - >-
                Do as you wish to help the people, including caring for bums, taking confessions, or spending your time criticizing sinners.
              - >-
                Along with the Bishop, you have the power to take confessions, dispelling psychological drawback tags.
            difficulty: easy
            multiple: true
            weight: 3
            starting_resources: 1
            starting_zone: town
            starting_location: cathedral
            starting_tags:
              - Cathedral Key
              - Ravenhearter
              - Chaplain
              - Teaching
              - Pious
              - Literate
              - Post-Christian
              - Vestments
              - Cross
            doc_elements:
              - townstarting
              - postchristianity
              - church
          scholastic:
            name: Scholastic
            intro: >-
              You are a servant of the truth, delving to places no other man would. Contemplate, search for knowledge — occult or otherwise — and write your magnum opus.
            description:
              - >-
                Earth is a speck in the infinite firmament. You have always been humbled — or perhaps energized — by the Truth. Try to understand it. Investigate the world around you, find out its hidden truths, and create your own Great Work. Be a hermit or preach on the streets. Whether you wake others up or not, ensure you yourself _never_ fall asleep.

                You can Research held items in the Cathedral, uncovering lost or secret crafting recipes.
            difficulty: normal
            multiple: true
            weight: 1
            starting_resources: 1
            starting_zone: town
            starting_location: cathedral
            starting_tags:
              - Cathedral Key
              - Ravenhearter
              - Literate
              - Post-Christian
            doc_elements:
              - townstarting
              - postchristianity
              - church
      the-sanctuary:
        name: The Sanctuary
        silo: sanctuary-supply-storage
        roles:
          esculap:
            name: Esculap
            intro: >-
              Lead the Sanctuary. Don't accrue debt. Treat only the rich and the noble. Develop medicines, put bodies back together, or pursue the good of science. Be the Eye in the Storm — or lose yourself to curiosity.
            description:
              - >-
                Sickness and pain leave men terrified and alone. It is a noble task to help another face that pain.
              - >-
                How you view your task — whether you're a savior or a businessman — is up to you. However, medicine is costly, so consider following tradition and only treating those with coin (or those with noble blood). It wouldn't do for the Sanctuary to rack up high debts just to save some peasants. The Sanctuary operates independently. It is your sole charge, and no one can give you orders (well, they can, but it would be counterproductive and unprecedented). However, it is protected by the Baron.
              - >-
                With science, the sky's the limit. You can brew medicines and potions, install implants and body-modifications, and even experiment.
              - >-
                If there's no wounded, get creative. Offer clinical trials; go foraging for unique ingredients and try to brew new potions; ask if the Incarn will let you experiment on his prisoners. Brewing potions is especially worthwhile; it can really help when you get a wave of inmates. Just throw out a few {tag:cleaning-powder}, a few {tag:mercy}, some {tag:poppy}…
              - >-
                You can perform medicine to remove negative medical tags according to their skill, Resource, and action cost.
            difficulty: normal
            multiple: false
            starting_resources: 26
            starting_zone: town
