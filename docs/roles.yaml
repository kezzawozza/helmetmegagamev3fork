          metalsmith:
            name: Metalsmith
            intro: >-
              Forge anything from basic tools to siege implements and legendary weapons.
            description:
              - >-
                With smithing, you are only limited by your Resources and your creativity. You can make weapons, but you can also make armor, tools, siege equipment, sculptures…
              - >-
                You're not on the Headman's payroll, so it's important you find clients so that you can feed yourself.
              - >-
                The theory is important to keep in mind. Axes are good at breaking shields; blunt weapons harm people even in full armor; swords excel in one-to-one combat.
              - >-
                Simple tools and weapons are cheap and quick; a moderate or high-quality piece — a proper sword, a breastplate — costs more of both, and something truly exceptional costs more still. Check the smithing price list for exact numbers.
              - >-
                You can also make Unique Tags — name and describe them yourself. You'll have to roll to see what the quality ends up being.
            difficulty: normal
            multiple: true
            weight: 2
            starting_resources: 20
            starting_zone: town
            starting_location: square
            starting_tags:
              - Ravenhearter
              - Smithing
              - Smithy Key
            doc_elements:
              - townstarting
              - smithing
              - combat
              - independent
          commoner:
            name: Commoner
            intro: >-
              You're a commoner. Make a living during the day, live your life at night.
            description:
              - >-
                There are many commoners, but each have their own lives, trades, and secrets.
              - >-
                Choose a Commoner Kit. You can be a farmer, a fisherman, a hunter, or ply your own trade. Fishermen start with a boat and hunters with bows, but farmers make by far the most production.
              - >-
                Different locations have different yields. The only place to farm in Ravenheart is in the Farms, a small location south of the town. To hunt, consider going to the Black Hills; to fish, go to the rivers around town or to the Marshes.
              - >-
                As a commoner, you have to pay taxes to the headman. Typically, the taxation rate leaves the farmers with almost no surplus.
              - >-
                If you fail to pay your taxes, you will likely face a brutal death. Even massed together, commoners are incapable of revolting against the Fortress. In any case, taxation is not the greatest threat: it is the evil that hides in the shadows of Ravenheart. Proper laboring supplies the Cerberon with the necessary resources to protect the lands.
            difficulty: easy
            multiple: true
            weight: unlimited
            starting_resources: 1
            starting_zone: town
            starting_location: square
            starting_tags:
              - Ravenhearter
              - Laboring (Skilled)
            doc_elements:
              - townstarting
              - production
              - independent
          mortus:
            name: Mortus
            intro: >-
              Bring spirits to peace and feed the Lifeweb.
            description:
              - >-
                You have two jobs, both of them sacred: to feed the Lifeweb and to bury people, bringing their souls to peace.
              - >-
                The Mortii take a lifelong vow dedicating themselves to powering the Lifeweb. They are often exiles, outcasts, or infirms. Why did you take the vow?
              - >-
                The Lifeweb maintains Ravenheart's environment. Without it, it'll fade into the wastelands. However, it is powered by human blood. People can either voluntarily donate their blood to feed it for a short time — or you can kidnap people and feed them manually. Dead bodies cannot be fed to the Lifeweb. Dead bodies can, however, be buried to bring the person's soul to peace (as a Routine Move).
              - >-
                Any crimes you commit in service of your vow are not crimes.
              - >-
                You are allowed to loot whatever corpses you find. That's how the Mortus traditionally sustain themselves, but if dead people are scarce, you can ask the Headman for some food.
            difficulty: easy
            multiple: true
            weight: 3
