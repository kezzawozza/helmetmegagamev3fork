        roles:
          innkeeper:
            name: Innkeeper
            intro: >-
              Name and run the inn: set prices, hire and fire staff, and run an actual, living business.
            description:
              - >-
                The inn is a game of its own. It's up to you to figure out how to make a living out of it. For one thing, you can consider asking the Merchant for a loan.
              - >-
                Cook fine meals, brew alcohol, hire bards and pretty ladies — keep the Customer coming back, yes, but be creative. Running an information network or turning the Inn into a place for people to find jobs are possible ways you can take advantage of owning Ravenheart's most popular enterprise.
