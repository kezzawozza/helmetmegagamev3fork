            starting_resources: 2
            starting_zone: marshes
            starting_location: factory
            starting_tags:
              - Laboring (Basic)
              - Hatchet
              - Cleaning Powder
              - Armored Gloves
              - Factory Key
            doc_elements:
              - godardfactory
          fisherman:
            name: Fisherman
            intro: >-
              Feed the factory and live a quiet life in the marshes.
            description:
              - >-
                Godard Factory is a strange place. As much money as they make, none of them know how to feed themselves. It's your job to bring them some food; the Banneret should pay you in obols.
            difficulty: easy
            multiple: false
