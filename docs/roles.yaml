  - name: Caves
    factions:
      the-company:
        name: The Company
        silo: depot-cargo-bay
        roles:
          merchant:
            name: Merchant
            intro: >-
              Make your fortune buying and selling Tags.
            description:
              - >-
                Ravenheart's poor souls are a great source of business, but it's a terrible place otherwise. You wouldn't dare put your heart here — the place is doomed. Time to make some money.
              - >-
                Your License lets you call down a shuttle. The mini-turret is keyed to your face, so it will shoot everyone except you. Be careful not to conceal your face, however.
              - >-
                You deal in obols (¢), not ⬢. You are the only place they come from and the only place they go back to. You can buy at the Depot's price and sell it at whatever makes sense for profit. You can also buy things from Ravenheartians and sell them to the Depot: brews, ore, cave fungus, smithing production, paintings. {tag:ravenheart-red} and paintings especially fetch a good price.
              - >-
                The Company will advance you up to 75 ¢ against the business. Your licence will be revoked if you fail to pay it.
              - >-
                You may issue loans, lending at high rates and calling on your Dockers to collect.
              - >-
                Taking the shuttle instead of the Railroad like a normal migrant costs 30 ⬢. And you have to have your license.
            difficulty: hard
            multiple: false
            starting_resources: 10
            starting_zone: caves
            starting_location: depot
            leader: true
            whitelist: true
            starting_tags:
              - Cart
              - Literate
