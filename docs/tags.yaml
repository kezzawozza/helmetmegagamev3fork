    category: general
    group: general-traits
    description: "You wake up to noise readily, such as footsteps in the night."
    fighting: { situational: true }
    pointCost: 1
    purchasable: true
    purchasableAfterStart: true

  # A drawback, so it GIVES a point back rather than costing one — same
  # posture as Frail and Old above.
  heavy-sleeper:
    catalog: all
    name: Heavy Sleeper
    psychological: true
    category: general
    group: general-traits
    description: "Not a good thing to be in Ravenheart."
    fighting: { situational: true }
    pointCost: -2
    conflictsWith: [light-sleeper]
    purchasable: true
    purchasableAfterStart: false

  depressed:
    catalog: all
    name: Depressed
    psychological: true
    category: general
    group: general-personality
    description: "Nothing is worth wanting. Locks all Desires. Can be cured by a Chaplain."
    # The floor of the Personality band: closes the whole catalog, opens
    # nothing (DESIRES.md §5, the 2026-09-02 sign-off).
    pointCost: -8
    purchasable: true
    # Curable + maximally valuable would be a point farm otherwise (R-1).
    purchasableAfterStart: false
    # Depressed IS a Desire tag -- it locks the whole catalog. So it conflicts
    # with the other tags that touch the Desire system: the ones carrying their
    # own desires: block, and the ones a Desire gates on in docs/desires.yaml.
    # A tag that never touches Desires has no quarrel with it, which is why
    # Lazy, Insomniac, Guilt Ridden, the phobias and Torturer sit beside it
    # quite happily. The Addictions carry their own edge back to us and are not
    # repeated here (sync pass 6 unions both directions).
    conflictsWith:
      - nobility
      - mad-doctor
      - esoteric
      - adventurer
      - cruel
      - charitable
      - death-wish
      - schemer
      - craven
      - kleptomaniac
      - superstitious
      - pacifist
      - eunuch
      - desperate
      - devoted-follower
      - hypochondriac
      - prudish
      - hot-headed
      - corrupt
    desires:
      locks:
        - all: true

  alcoholic:
    catalog: all
    name: Alcoholic
    psychological: true
    category: general
    group: general-addictions
    description: "You're addicted to drinking. Your bottom Desire slot is locked to Desires about drinking."
    pointCost: -4
    exclusive: true
    purchasable: true
    purchasableAfterStart: false
    consumable: false
    conflictsWith: [depressed, prudish]
    desires:
      locks:
        - all: true
          exceptFamilies: [alcohol]
          slot: bottom

