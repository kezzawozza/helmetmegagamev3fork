  # --- Lockboxes ------------------------------------------------------------
  # A locked find and its picked-open half, three pairs. Lockpicking
  # (pointCost 4, purchasable) existed as a pure flavor skill with no
  # mechanical hook anywhere until this — these are its first real use. Each
  # pair is two tags rather than one because the engine has no single verb
  # that is both skill-gated AND grants a list: `craftable` gates on a skill
  # but produces exactly one tag, `consumesInto` grants a whole list but gates
  # on nothing. So the box crafts (Lockpicking-gated, 0 ⬢, 0 turns, same
  # shape as Bone Mask's `butcher` gate above) into its own Spoils tag, and
  # THAT consumes into the real items — two player actions, zero new engine
  # code (Bascinet, 2026-09-10).
