  # A creation-only bundle rather than a thing you carry: it sits on the sheet
  # until the player unpacks it from their own character sheet (see consumable
  # in this file's header). Not tradeable or stackable — there's nothing to
  # hand over, and buying two would just collapse into one.
  starting-wares:
    catalog: all
    name: Starting Wares
    category: items
    group: items-gear
    sprite: crate
    description: "Goods you came in with, still crated. Unpack them whenever you like. [This is a small trader's stock, should you wish to go into business. Its real value is in what you can talk somebody into paying for it.]"
    pointCost: 14
    weight: 12
    purchasable: true
    purchasableAfterStart: false
    consumable: true
    # Priced by what it unpacks into, the rule TAGS.md §4a sets for every
    # consumable and the rule this tag was caught breaking once already:
    # 2 Jewelry (1 pt each) + Instant Camera (1) + Sword Cane (3) = 6 pt.
    #
    # The 0-pt goods after those cost nothing on the scale and are the point
    # of the rebuild — a would-be trader now opens the crate onto actual
    # stock to haggle over, instead of a revolver. The comforts among them are
    # ordinarily Depot-only (docs/systemdocs/DEPOT.md §3), which is exactly
    # right: you brought them in with you, the same way the Merchant does.
    # Nothing here is hardware, so this is not a back door to his real shelf.
    consumesInto:
      - jewelry
      - jewelry
      - instant-camera
      - sword-cane
      - old-coin
      - old-coin
      - tea
      - coffee
      - sake
      - sugar-candy

  # A crate sitting in the Merchant's Cargo Bay. The Depot's real crates are
  # runtime Tag rows minted per shuttle (docs/systemdocs/DEPOT.md §5), which a
  # YAML stash cannot name — so the one that is simply THERE at the start is
  # an ordinary authored consumable, the same shape as Starting Wares above.
  # Heavy, because it is a crate: carrying one off is a decision.
  # --- Commoner kits ------------------------------------------------------
  # --- Courtier kits ------------------------------------------------------
  # A note on the descriptions: Knighted, Old Blood and Dancer are named in
  # plain prose rather than as {tag:...} chips, unlike everything else these
  # crates hold. All three live in `general-court`, which is gated behind the
  # `courtier` tag -- and getVisibleTags (web/lib/referenceData.js) drops a
  # gated tag for anyone not holding the gate, so a chip for one renders as
  # the literal token on the creation screen, where NOBODY holds it yet.
  # The same crate idiom as the Commoner kits above, for the opposite reason.
  # A Commoner needs a trade; a Courtier needs a REASON to be in the room. The
  # base seat is three tags and an invitation to invent your own goals, which
  # is a lot of nothing to hand somebody on turn one -- so each of these is a
  # courtly life bought whole, in one pick rather than six.
  #
  # `onlyRoles: [courtier]` is load-bearing, exactly as it is up there. Each
  # kit holds far more than it costs (the Tutor is 17 points of tags for 4, the
  # Seasoned Knight 42 for 9), which is fine for the seat these were written
  # for and a faucet for anybody else. The `courtier` TAG would be the wrong
  # gate: the Baron, the Baroness, the Heir, the Successor, the Hand and the
  # Meister all carry it, and several of them already draw
  # extra_starting_points. The role slug is the narrow thing meant here.
  courtier-herald:
    catalog: all
    name: "Courtier: Herald"
    category: items
    onlyRoles: [courtier]
    conflictsWith: [courtier-seasoned-knight, courtier-tutor, courtier-chaplain, courtier-carouser, courtier-manor-lord, courtier-debutante, courtier-court-physician, courtier-court-artist, courtier-master-engineer]
    group: items-gear
    sprite: horn
    description: "Live carrying out messages for the Baron and telling the day's news. Gives an {tag:arelitz}, a {tag:trumpet}, a {tag:bird} and four sheets of {tag:paper}."
