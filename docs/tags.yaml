  blessing:
    catalog: all
    name: Blessing
    category: skills
    requiredTag: chaplain
    description: "You can craft {tag:holy-water}. Poured on the offender, it reduces the efficacy of unholy activity."
    pointCost: 3
    purchasable: true
    purchasableAfterStart: true

  # The Scholastic's own craft, granted only through `scholastic.starting_tags`
  # (docs/roles.yaml) — 0-point, unpurchasable, like every other role grant
  # (TAGS.md §4a). Not teachable: it is the role's own work, not a lesson,
  # the same exception the Teaching tree carries on `teachable` (TAGS.md
  # "teachable" note, `teaching-drill-instructor` above).
  research:
    catalog: gm
    name: Research
    category: skills
    teachable: false
    description: "The Cathedral's archives hold many secrets. Use them to research forgotten uses for ingredients, revealing secret recipes."
    pointCost: 0
    purchasable: false
    purchasableAfterStart: false

  caving:
    catalog: all
    name: Caving
    category: skills
    teachable: true
    description: "You know about some secret connections between the surface and the caves."
    pointCost: 4
    purchasable: true
    purchasableAfterStart: true

  artist:
    catalog: all
    name: Artist
    category: skills
    teachable: true
    description: "Well, it's lovely, but I'm not paying for it. You draw, paint, sculpt, act, or pursue another creative medium inessential for survival. Perhaps you can find a patron? The Merchant might buy these… You can craft a {tag:painting}, but it takes 4 turns."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  laboring-basic:
    catalog: all
    name: Laboring (Basic)
    category: skills
    group: skills-labor
    teachable: true
    description: "You can sometimes provide for yourself. Can produce {resource:labor:basic} every other turn."
    pointCost: 7
    purchasable: true
    purchasableAfterStart: true

  laboring-skilled:
    catalog: all
    name: Laboring (Skilled)
    category: skills
    group: skills-labor
    teachable: true
    description: "You can provide for yourself and others. Can produce {resource:labor:skilled} every other turn."
    pointCost: 7
    parentTag: laboring-basic
    purchasable: true
    purchasableAfterStart: true

  # The four side-grades. Each needs Laboring (Skilled) behind it, each is
  # scaled by where you are standing (docs/zones.yaml's per-location `yield:`
  # block), and holding several is fine — a Labor pays the best one you
  # qualify for, so there is nothing to switch and nothing to forget.
  laboring-hunting:
    catalog: all
    name: Laboring (Hunting)
    category: skills
    group: skills-labor
    teachable: true
    description: "While laboring in a wilderness location, you produce {resource:labor:hunting}."
    pointCost: 7
    requiredTag: laboring-skilled
    purchasable: true
    purchasableAfterStart: true

  laboring-farming:
    catalog: all
    name: Laboring (Farming)
    category: skills
    group: skills-labor
    teachable: true
    description: "While laboring in fields and worked ground, you produce {resource:labor:farming}."
    pointCost: 7
    requiredTag: laboring-skilled
    purchasable: true
    purchasableAfterStart: true

  laboring-fishing:
    catalog: all
    name: Laboring (Fishing)
    category: skills
    group: skills-labor
    teachable: true
    description: "While laboring in a location with water, you produce {resource:labor:fishing}."
    pointCost: 7
    requiredTag: laboring-skilled
    purchasable: true
    purchasableAfterStart: true

  # The two Laboring MASTERIES. Both need Laboring (Skilled) behind them and
  # neither can be bought at creation — see TAGS.md 4a on the mastery band.
  # Neither is teachable: a capstone bought only after the game starts must not
  # be obtainable for the price of one Lesson Move.
  #
  # Scavenging redraws on the 6's pool when a 4 or a 5 finds an EMPTY one
  # (db/lib/laborDrops.js) rather than remapping every 4 and 5, which would take
  # a fisherman's 10 ⬢ face away and hand him a 1.56 ⬢ one. A 1 still hurts.
  laboring-scavenging:
    catalog: all
    name: Laboring (Scavenging)
    category: skills
    group: skills-labor
    teachable: false
    description: "You have an eye for what a day's work turns up. Your laboring finds something far more often, and what a good day turns up is never an injury."
    pointCost: 12
    requiredTag: laboring-skilled
    visible: false
    purchasable: true
    purchasableAfterStart: true
    mastery: true

  # Tireless does two things, and the second is the one that matters. The gate
  # in db/lib/laborAccess.js lets the holder work while Exhausted at half yield;
  # the fatigue ladder then needs NO special case, because
  # db/lib/laborFatigue.js#nextLaborFatigueSlug already returns null for anybody
  # who is Exhausted — so the work neither escalates nor refreshes the tag, and
  # the holder can labor every turn instead of one turn in three.
  laboring-tireless:
    catalog: all
    name: Laboring (Tireless)
    category: skills
    group: skills-labor
    teachable: false
    description: "You can work through exhaustion. While {tag:exhausted} you still labor, at half of what you would otherwise make."
    pointCost: 14
    requiredTag: laboring-skilled
    visible: false
    purchasable: true
    purchasableAfterStart: true
    mastery: true

  # Joined 2026-09-09. Pays the least ⬢ of the four on purpose — a labor drop
  # (LABORDROPS.md) is meant to make up the difference in items rather than
  # coin, once that table is built out.
  laboring-prospecting:
    catalog: all
    name: Laboring (Prospecting)
    category: skills
    group: skills-labor
    teachable: true
    description: "While laboring somewhere worth searching — a stream, a ruin, the undergrowth — you turn up {resource:labor:prospecting}: thin pay in Resources, but plenty else comes up with it."
    pointCost: 7
    requiredTag: laboring-skilled
    purchasable: true
    purchasableAfterStart: true

  forester:
    catalog: all
    name: Forester
    category: skills
    teachable: true
    description: "You are at home in the woods, gaining an advantage in finding food, water, or shelter."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  musician:
    catalog: all
    name: Musician
    category: skills
    teachable: true
    description: "You sing or play instruments. People love your musical talents."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  # A Musician MASTERY: quadruples what /play is worth to everyone who hears
  # it. Gated on Musician because the mood half of /play already lives inside
  # that check (db/lib/instrumentPlay.js) — without the parent, playing badly
  # soothes nobody and this would be worth nothing.
  musician-pythagorean:
    catalog: all
    name: Musician (Pythagorean)
    category: skills
    teachable: false
    description: "Your music is complex and absorbing. It makes everyone ecstatic, buffing their mood massively."
    pointCost: 14
    requiredTag: musician
    visible: false
    purchasable: true
    purchasableAfterStart: true
    mastery: true

  # Smithing is split into two rungs, gating the Dead Simple / Simple recipes
  # against the Moderate / High Quality / Exceptional ones. Full price and
  # resource table in SMITHING.md.
  smithing:
    catalog: all
    name: Smithing
    category: skills
    group: skills-crafting
    teachable: true
    description: "Basic smithing."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  smithing-skilled:
    catalog: all
    name: Smithing (Skilled)
    category: skills
    group: skills-crafting
    teachable: true
    description: "Skilled smithing — the Moderate and higher recipes."
    pointCost: 5
    parentTag: smithing
    visible: false
    purchasable: true
    purchasableAfterStart: true

  crafting:
    catalog: all
    name: Crafting
    category: skills
    group: skills-crafting
    teachable: true
    description: "Lets you tailor, craft, woodwork, and any other form of miscellaneous production. Also fulfills requirements for Dead Simple smithing recipes."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  butcher:
    catalog: all
    name: Butcher
    category: skills
    teachable: true
    description: "You can butcher monster and human corpses. Additionally, Hunting laboring yields +1 ⬢."
    laborBonus: { kind: hunting, amount: 1, equipped: false }
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  lockpicking:
    catalog: all
    name: Lockpicking
    category: skills
    teachable: true
    description: "Nothing on one… little click on two… click on three… aha! You can pick locks."
    pointCost: 4
    purchasable: true
    purchasableAfterStart: true

  climbing:
    catalog: all
    name: Climbing
    category: skills
    teachable: true
    description: "You used to go up the mountains as a child."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  # The one Skill that reads on a gate crossing
  # (db/lib/locationMove.js#announceLevelFor). It moves the announcement down
  # one step: an unmanned gate says nothing at all, a manned one describes you
  # instead of naming you. Price left at 5 — Bascinet's call when it stopped
  # being flavour, so it stays on the ordinary Moderate band.
  stealth:
    catalog: all
    name: Stealth
    category: skills
    teachable: true
    description: "You are adept at sneaking around and concealing yourself. Others will be less likely to spot you doing so."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  smithing-gunpowder:
    catalog: all
    name: Smithing (Gunpowder)
    category: skills
    group: skills-crafting
    teachable: true
    description: "{tag:saltpeter} is your best friend. Requires Skilled smithing."
    pointCost: 9
    requiredTag: smithing-skilled
    mastery: true
    visible: false
    purchasable: true
    purchasableAfterStart: true

  # ─── Melee / Ranged ─────────────────────────────────────────
  # The single Fighting tree is split in two, and the halves never overlap.
  # Both run Basic -> Trained -> Skilled -> Expert -> Legendary at 7 pt a
  # rung, Legendary at 14.
  #
  # Sidegrades nominally cost 10 — two tiers inside one narrow circumstance,
  # roughly 1.4x a rung, and nothing at all outside it. The band has more
  # exceptions than members by now: Flamboyant 7, Sniper 7, Throwing Weapons 4,
  # Guerrilla 5. Each is Bascinet's own call and TAGS.md §4a records them;
  # price a new one off that section rather than off this comment.
  #
  # Grappler is 5 and standalone — bare hands are not a rung of either tree,
  # so it gates on nothing. Guerrilla is ungated for a different reason: it
  # reads "whether melee or ranged", and a single `requiredTag` cannot say
  # "either tree".

