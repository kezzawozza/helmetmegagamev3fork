  # an evening can manage, which is what the old free button said too.
  # `perTurn` rather than the shared Dead Simple pool, so binding four books
  # does not eat somebody's knife-making for the day.
  #
  # NO literacy gate, unlike the old button — Craft has no notion of letters,
  # and it turns out that is right: sewing pages together is not writing. The
  # gate moved to where the writing is, which is where writePaperImpl's
  # readBlock check has always been.
  blank-book:
