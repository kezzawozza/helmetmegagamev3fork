  # --- The apothecary -----------------------------------------------------
  #Needs resources and a special ingredient acquired through RP. GMs need to adjudicate the results,
  #as most of these are spent through Moves, not automatically.

  # --- Basic tonics — Brewing I --------------------------------------
  miasma:
    catalog: all
    name: Miasma
    category: items
    group: items-drink
    sprite: bottle15
    description: "A bottle that stinks of rotting flesh. Can be uncorked to give {tag:vomiting} to everyone in a closed room."
    pointCost: 0
    weight: 0.5
    stackable: true
    visible: false
    purchasable: false
    purchasableAfterStart: false
    craftable: true
    consumable: true
    requirement:
      turnsCost: 1
      resourceCost: 2
      skills: [brewing-basic]
      gambit: false
      # ANY corpse, which is why this names a group rather than a slug: a
      # person's corpse tag is written at death and is never in this file, so
      # nothing authored here could name one. Held, not consumed — you bottle
      # the smell, you don't use the body up.
      items:
        - group: items-corpse
      # Without this, `group: items-corpse` above hides the recipe from
      # everyone until they hold a corpse: nekker-corpse, graga-corpse and
      # skinless-corpse are all catalog: secret (CRAFTING.md §2b), so the
      # group is never fully public and the gate never opens on its own. A
      # basic Brewing recipe should not need a body in hand just to learn it
      # exists — reported by a player whose Craft menu never showed it.
      recipePublic: true
    sellable: true
    sellablePrice: 5
    cooked:
      taste: "rotting flesh"
      mood: -45

