  # Basic, Skilled and Skilled Lavish Cooking (docs/systemdocs/COOKING.md
  # §A1-A9): replaces the old Fine Meal / Lavish Meal pair. Each recipe has
  # FIXED base ingredients (consumed automatically, gating what the recipe
  # even is) plus a slot layer for player-chosen additional ingredients —
  # what the cooked dish actually carries on eating (mealTaste/mealMood/
  # mealHunger are the recipe's own small base figure, read FIRST in the
  # taste line; the additional ingredients' cooked.taste/mood/hunger are
  # summed on top, same mechanism COOKING.md §6-7 already had).
  #
  # Common shape across all 19+6+10: catalog: all, category: items, group:
  # items-food, craftable + customizable (naming is free, no description —
  # matches fine-meal's old posture), weight 0.5 (every foodstuff, cooked or
  # raw, is 0.5 lb per the design doc), consumesInto [ate-meal, dined] (both
  # meals this replaces already granted dined regardless of tier, so every
  # rung here does too — Trail Ration and Honeyed Cakes below stay the two
  # exceptions that don't), ingredientSlots 0-4 (INGREDIENT_SLOTS_MAX, the
  # dialog's own ceiling — the design doc names no cap), and no resourceCost:
  # the base ingredients are the price, not ⬢.
