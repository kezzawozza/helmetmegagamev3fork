  # --- Milestone D catalog fill: everything below is pure YAML over the
  # A-C mechanisms — no new code. Numbers are design-facing placeholders
  # for Gunboat to reprice; players see words.

  lazarette:
    catalog: all
    name: Lazarette
    category: assets
    group: assets-structures
    description: "A clean house for the sick: scrubbed boards, boiled linen, well-made beds. Medical treatment done where this is erected is done as if the treater's Medical skill is 1 tier higher."
    pointCost: 0
    visible: false
    tradeable: false
    purchasable: false
    purchasableAfterStart: false
    craftable: true
