  # --- Paperwork -----------------------------------------------------------
  #
  # See docs/systemdocs/PAPERWORK.md. Three kinds of thing live here: the blank
  # stock below, the wax stamps that seal a finished letter, and — at runtime —
  # every sheet anybody actually writes on, which is a minted Tag row and is
  # never in this file.
  #
  # A stamp is declared by `sealMark:`, its distinguishing line. The sync
  # composes the whole description around it, so the boilerplate is written
  # once and nothing can drift; authoring a `description:` beside a `sealMark:`
  # is an error rather than an override.

  # The cheapest thing the Depot sells, on purpose. Paper has to be something
  # a scribe buys by the ream without thinking about it, or nobody writes.
  # The Depot stocks the REAM, not the sheet: 3 ⬢ for twenty sheets is the
  # same paper at a fifth the price, and it stops the shelf carrying a
  # weightless 1 ⬢ line that every order padded itself out with.
  # A ream, bought once at creation and unpacked when you need it. The twenty
  # repeats are the mechanism, not a mistake: repeating a slug is the only way
  # consumesInto asks for several of something, and it multiplies here because
  # `paper` is stackable (TAGS.md §5b).
  stack-of-paper:
    catalog: all
    name: Stack of Paper
    category: items
    group: items-paper
    sprite: paper-bin
    description: "A ream of blank sheets. It can be consumed into paper."
    pointCost: 1
    depotPrice: 2
    weight: 2
    stackable: true
    visible: false
    purchasable: true
    purchasableAfterStart: false
    consumable: true
    consumesInto:
      - paper
      - paper
      - paper
      - paper
      - paper
      - paper
      - paper
      - paper
      - paper
      - paper
      - paper
      - paper
      - paper
      - paper
      - paper
      - paper
      - paper
      - paper
      - paper
      - paper

