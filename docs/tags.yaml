  # Resources themselves. Until 9/2026 this was a number on a sheet
  # (Character.resources / Room.resources) that weighed nothing and could not
  # be picked up, dropped, stolen or looted — the one piece of wealth in the
  # game that was not an object. It is an object now, and everything that
  # follows from that comes free: a sack of material is stashed in a room,
  # handed over, pickpocketed, looted off a corpse and set down when you are
  # carrying too much, through exactly the same stack machinery every other
  # item uses. Nothing special-cases it.
  #
  # A pound each, which is not a new number: db/lib/depotCrates.js has always
  # priced a CRATED ⬢ at a pound, and loose ⬢ weighing nothing was the
  # inconsistency. That means there is no second carry cap any more — ⬢ push
  # against GameConfig.carryWeightLbs beside the gear, and a fortune in raw
  # material is a cart's worth of work to move (docs/systemdocs/CARRY.md).
  #
  # Priced on BOTH sides so the Depot trades it as an ordinary ware: bought at
  # depotPrice 2, bought back at sellablePrice 1, the losing round trip
  # db/lib/depot.js has always described. The economy ledger still books it as
  # form BALANCE rather than GOODS, so /gm/economy goes on telling ⬢ and obols
  # apart (docs/systemdocs/ECONOMY.md §1).
  #
  # HIDDEN, exactly like `obol`, and for the same two reasons. A visible stack
  # put a bare "Resources" line in every bystander's Examine, which announced
  # that there was a balance worth taking — the one fact the officer-only
  # ⬢ line is written to withhold. And `hideableFromSearch` only covers HIDDEN
  # and WORN (db/lib/medicalVision.js), so a visible stack could never be
  # palmed: obols were safe from a search and the ⬢ beside them never were,
  # which made converting at the Depot strictly correct rather than a trade.
  resources:
    catalog: all
    name: Resources
    category: items
    group: items-gear
    description: "Bulk material for crafting, smithing, or healing people."
    manifest: general
    pointCost: 0
    weight: 1
    stackable: true
    visible: false
    purchasable: false
    purchasableAfterStart: false
    depotPrice: 2
    sellable: true
    sellablePrice: 1

  # The Depot's currency, and worth exactly one ⬢.
  #
  # What it buys you is WEIGHT, and that reading is the other way up since
  # 9/2026. It used to make value physical: ⬢ were a number on a sheet nobody
  # could pick your pocket for, and an obol was the same value as an object you
  # could carry, hand over, stash and lose. ⬢ are all of those things now, and
  # they weigh a pound each — so the obol is the money that does NOT weigh
  # anything, and a fortune in coin still fits in a pocket while the same
  # fortune in raw material is a cart's worth of work.
  #
  # That is the trade the Depot sells: walk your ⬢ to the counter and carry
  # the value home weightless. Only the Merchant issues them and only he
  # redeems them, so a purse of these is worth exactly as much as your ability
  # to reach the Depot. See docs/systemdocs/DEPOT.md.
  obol:
    catalog: all
    name: Obol
    category: items
    group: items-gear
    sprite: 5obol
    description: "A small coin used by the Merchant."
    pointCost: 0
    weight: 0
    stackable: true
    visible: false
    purchasable: false
    purchasableAfterStart: false
    # NOT CRAFTABLE, and do not make it so again. A smith used to strike these
    # — 1 ⬢ in, 1 obol out — so a recipe's cost could be paid partly in coin
    # without depending on loot luck. It was also a mint: an obol is weightless
    # and a ⬢ is a pound, so ten a turn turned a cart of raw material into
    # something that fits in a pocket, for free, forever. Coin enters the world
    # through the Merchant and the train and nowhere else, which is what makes
    # a purse of them worth exactly as much as your ability to reach the Depot.
    #
    # Paying a recipe's cost WITH held obols still works (resolveObolSpend,
