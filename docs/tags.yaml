  # --- The drinking ladder (docs/systemdocs/BREWING.md) --------------------
  #
  # Three rungs, and every drink in the catalog still consumes into the first
  # one. `escalatesInto` is what makes the second drink matter: consuming
  # something that grants a rung you already hold clears that rung and gives
  # you the one above instead. So tipsy -> wasted -> unconscious, and the only
  # way down is to stop.
  #
  # The Fighting penalties below are ordinary generic `fighting:` blocks, not
  # special cases: no line of code branches on `tipsy`. The one place a rung is
  # named by slug is Drunken Master's `holdsAny`, which is a catalog entry too.
