    placement:
      examine: "anvil set, bellows hung."
      provides: [workshop-equipment]

  # Bascinet's three, 2026-09-10. Each one is the first user of a new
  # placement key; the keys themselves are documented on Tag.placement.

  # Buildable only at the inn, because that is where the cellar it fills is.
  # `locations` naming exactly one Location is also what makes it one-of-a-kind
  # — `unique` is per-Location, so a single legal site means a single brewery.
  brewery:
    catalog: all
    name: Brewery
    category: assets
    group: assets-structures
    description: "A brewery. It automatically produces one {tag:alcohol} per turn, to the inn's cellar."
    pointCost: 0
    visible: false
    tradeable: false
    purchasable: false
    purchasableAfterStart: false
    craftable: true
    requirement:
      turnsCost: 2
      resourceCost: 15
      skills: [builder-skilled]
      gambit: false
    placement:
      # Unlike the forge, no workshop is needed. The forge's exemption is a
      # bootstrap — you cannot build the first forge without one — and there
      # is no such loop here.
      fieldwork: true
      locations: [old-cock-inn]
      examine: "it'll actively produce alcohol as long as a brewer is around."
      yields: { tag: alcohol, room: inn-cellar, quantity: 1, skill: brewing-basic }

