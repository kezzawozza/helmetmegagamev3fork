    purchasable: true
    purchasableAfterStart: true

  keen-hearing:
    catalog: all
    name: Keen Hearing
    category: general
    group: general-traits
    description: "You hear like a bat."
    fighting: { tree: both, tiers: 0.3 }
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  eagle-eyes:
    catalog: all
    name: Eagle Eyes
    category: general
    group: general-traits
    description: "You see like a hawk. Or an eagle, you suppose."
