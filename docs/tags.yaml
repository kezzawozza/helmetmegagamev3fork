  # Ten sheets bound between boards, with nothing written in them yet. An
  # ORDINARY craft recipe — it used to be a Bind a Book button of its own, and
  # the reason it could not be a recipe was that `items:` had no way to say
  # "ten". It does now (`count:`), so it does not need a button.
  #
