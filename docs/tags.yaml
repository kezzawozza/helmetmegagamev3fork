  # --- The Godard Factory --------------------------------------------------
  # The marsh production chain: Godflesh comes out of the wet ground, refines
  # into Squeeze on the Factory floor, and gets crated for the Merchant. See
  # docs/systemdocs/FACTORY.md.
  # Public (Chris 2026-09-07): the marsh is common knowledge — the public
  # Alcohol & Drugs paper prints the moonshine row outright.
  godflesh:
    catalog: all
    name: Godflesh
    category: items
    group: items-gear
    description: "A fibrous, pink substance harvested from the waterlogged marshes. While alive, it squirmed and bit at anyone handling it."
    pointCost: 0
    tradeable: true
    weight: 28
    stackable: true
    visible: true
    purchasable: false
    purchasableAfterStart: false
    consumable: true
    consumesInto: [vomiting]

  squeeze:
    catalog: gm
    name: Squeeze
    category: items
    group: items-gear
    description: "A gelatinous pink cube."
    pointCost: 0
    tradeable: true
    weight: 17
    stackable: true
    visible: true
    purchasable: false
    purchasableAfterStart: false
    consumable: true
    consumesInto: [seizure]
    # Nothing in Ravenheart wants a cube. The Depot buys every one of them,
    # which is the whole reason the Factory exists — 8 cubes is a day's work
    # and pays about four times a good farming day.
    sellable: true
    sellablePrice: 7

  # UNTRADEABLE on purpose, which is the only thing that actually pins it down:
  # `removable: false` blocks the Destroy menu and nothing else, so while this
  # was tradeable anyone holding a Factory Key could pick the crating bench up,
  # walk it into the Spillway, and delete the Factory's whole reason to exist —
  # there are exactly two in the world and neither is craftable. Untradeable
  # also means it carries no weight, which is right for a fixture: nobody is
  # hauling it anywhere.
  packaging-equipment:
    catalog: gm
    name: Packaging Equipment
    category: items
    group: items-gear
    description: "Bolten down tools that allow one to package things into crates."
    pointCost: 0
