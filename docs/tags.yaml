  # --- Courtier kits ------------------------------------------------------
  # A note on the descriptions: Knighted, Old Blood and Dancer are named in
  # plain prose rather than as {tag:...} chips, unlike everything else these
  # crates hold. All three live in `general-court`, which is gated behind the
  # `courtier` tag -- and getVisibleTags (web/lib/referenceData.js) drops a
  # gated tag for anyone not holding the gate, so a chip for one renders as
  # the literal token on the creation screen, where NOBODY holds it yet.
  # The same crate idiom as the Commoner kits above, for the opposite reason.
  # A Commoner needs a trade; a Courtier needs a REASON to be in the room. The
  # base seat is three tags and an invitation to invent your own goals, which
  # is a lot of nothing to hand somebody on turn one -- so each of these is a
  # courtly life bought whole, in one pick rather than six.
  #
  # `onlyRoles: [courtier]` is load-bearing, exactly as it is up there. Each
  # kit holds far more than it costs (the Tutor is 17 points of tags for 4, the
  # Seasoned Knight 39 for 9), which is fine for the seat these were written
  # for and a faucet for anybody else. The `courtier` TAG would be the wrong
  # gate: the Baron, the Baroness, the Heir, the Successor, the Hand and the
  # Meister all carry it, and several of them already draw
  # extra_starting_points. The role slug is the narrow thing meant here.
  courtier-herald:
    catalog: all
    name: "Courtier: Herald"
    category: items
    onlyRoles: [courtier]
    conflictsWith: [courtier-seasoned-knight, courtier-tutor, courtier-chaplain, courtier-carouser, courtier-manor-lord, courtier-debutante, courtier-court-physician, courtier-court-artist, courtier-master-engineer]
