  # ---------------------------------------------------------------------
  # The Silver Chip shelf (docs/systemdocs/DEPOT.md §0e).
  #
  # Nine wares the Depot imports and the Pusher resells. Every one of them is
  # BUY-ONLY: a depotPrice and no sellablePrice at all, the shape bar-soap
  # already uses. That is deliberate and it now covers the whole black-market
  # shelf, brews included — you can buy a drug at the counter and you can
  # never sell one back, so the market for them is other players.
  #
  # None of them authors its mood. A drug restores no hunger, so the consume
  # path never reads `cooked.mood` for one (web/.../actions/misc.js) — what a
  # drug does to the dial is a row in CONSUME_RELIEF (db/lib/mood.js), and the
  # two that go straight to the top SET the dial there rather than adding to
  # it.
  #
  # `taste:` is "something bitter" for most of them, the phrasing Soporific
  # and Poppy Pods already use — tasteLine() writes "It tastes like {taste}",
  # so a bare adjective does not parse. Kzozel Yantar tastes of alcohol and
  # Ambrosia of itself.
  # ---------------------------------------------------------------------

