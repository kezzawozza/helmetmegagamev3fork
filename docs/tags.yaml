    visible: false
    purchasable: true
    purchasableAfterStart: true

  melee-trained:
    catalog: all
    name: Melee (Trained)
    category: skills
    group: skills-fighting
    teachable: true
    description: "You have been trained how to fight."
    fighting: { tree: melee, rung: 2 }
    pointCost: 7
    parentTag: melee-basic
    visible: false
    purchasable: true
    purchasableAfterStart: true

  melee-skilled:
    catalog: all
    name: Melee (Skilled)
    category: skills
    group: skills-fighting
    teachable: true
    description: "You've actually fought before. You're a grizzled presence on the battlefield."
    fighting: { tree: melee, rung: 3 }
    pointCost: 7
    parentTag: melee-trained
    visible: false
    purchasable: true
    purchasableAfterStart: true

  melee-expert:
    catalog: all
    name: Melee (Expert)
    category: skills
    group: skills-fighting
    teachable: true
    description: "You've survived many fights. Almost no one matches you."
    fighting: { tree: melee, rung: 4 }
    pointCost: 7
    parentTag: melee-skilled
    visible: false
    purchasable: true
    purchasableAfterStart: true

  melee-legendary:
    catalog: gm
    name: Melee (Legendary)
    category: skills
    group: skills-fighting
    teachable: true
    description: "The peak of your generation."
    fighting: { tree: melee, rung: 5 }
    pointCost: 7
    parentTag: melee-expert
    visible: false
    purchasable: false
    purchasableAfterStart: false

  ranged-basic:
    catalog: all
    name: Ranged (Basic)
    category: skills
    group: skills-fighting
    teachable: true
    description: "You can hold a weapon and defend yourself in a pinch."
    fighting: { tree: ranged, rung: 1 }
    pointCost: 7
    visible: false
    purchasable: true
    purchasableAfterStart: true

  ranged-trained:
    catalog: all
    name: Ranged (Trained)
    category: skills
    group: skills-fighting
    teachable: true
    description: "You have been trained how to fight."
    fighting: { tree: ranged, rung: 2 }
    pointCost: 7
    parentTag: ranged-basic
    visible: false
    purchasable: true
    purchasableAfterStart: true

  ranged-skilled:
    catalog: all
    name: Ranged (Skilled)
    category: skills
    group: skills-fighting
    teachable: true
    description: "You've actually fought before. You're a grizzled presence on the battlefield."
    fighting: { tree: ranged, rung: 3 }
    pointCost: 7
    parentTag: ranged-trained
    visible: false
    purchasable: true
