    purchasable: true
    purchasableAfterStart: true

  brave:
    catalog: all
    name: Brave
    category: general
    group: general-traits
    description: "Fearlessness isn't a choice, it's the natural state of your mind. Everything frightens you half as much."
    fighting: { tree: both, tiers: 0.3 }
