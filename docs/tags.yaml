  # The precursor to Exhausted (db/lib/laborFatigue.js). Granted by a day's
  # Labor, or by a bad night's sleep (Guilt Ridden, Insomniac). Doesn't block
  # anything by itself — Labor, or a second bad night, escalates it straight
  # to Exhausted instead of refreshing this. Left alone, it clears on its
  # own — durationTurns: 1 the same way Exhausted's does, so it only survives
  # into the very next turn.
  tired:
    catalog: gm
    name: Tired
    category: status
    group: status-debuffs
    description: "You worked hard, or slept badly. Push yourself again and you'll wear yourself out."
    fighting: { tree: both, tiers: -0.5 }
    pointCost: 0
    purchasable: false
    durationTurns: 1

  # The escalated half of the same ladder (db/lib/laborFatigue.js). Reached by
  # Laboring, or a bad night's sleep, while already Tired — two days running,
  # or two bad nights running. durationTurns: 1 is what makes the clock work:
  # granted while turn T closes, it blocks turn T+1 and degrades back into
  # Tired when T+1 closes.
  exhausted:
    catalog: gm
    name: Exhausted
