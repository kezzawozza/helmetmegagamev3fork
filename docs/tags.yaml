      resourceCost: 6
      skills: [builder-skilled]
      gambit: false
    placement:
      fieldwork: true
      examine: "a stake driven deep, claiming this ground."
      miningBonus: { amount: 1 }

  forge:
    catalog: all
    name: Forge
    category: assets
    group: assets-structures
    description: "A standing hearth, anvil and bellows. Allows for Smithing where erected."
    pointCost: 0
    visible: false
    tradeable: false
    purchasable: false
    purchasableAfterStart: false
    craftable: true
    requirement:
      turnsCost: 2
      resourceCost: 15
      skills: [builder-skilled]
      gambit: false
    # Deliberately NOT fieldwork: raising a forge is smith's work itself, so
