  # --- Corpses -----------------------------------------------------------
  # Bodies as real, carryable objects. These three are what a monster leaves;
  # a person's corpse is written per-character at death instead
  # (db/lib/corpseMint.js), into this same group. See CORPSES.md.
  #
  # Every one of them: `visible: true`, because you are visibly hauling a body
  # — the exact case the `visible` rule at the top of this file names.
  # `stackable: false`, because one body is one body, and the non-stackable pin
  # in db/lib/tagWrites.js is also what stops two people each holding "the"
  # corpse. `removable: false`, because Butcher and Bury are the only two ways
  # a body leaves the world — it must not be quietly binnable from Destroy.
