  # --- assets -------------------------------------------------------
  # `tradeable` decides what can be handed over OR lifted off a body, so every
  # entry here states it outright (db/lib/syncTags.js enforces that). Mounts,
  # vehicles and ordinary animals travel: they are standing right there and
  # anyone can lead them away. Real property does not — you cannot carry a boat
  # off a corpse.
  horse:
    catalog: all
    name: Horse
    category: assets
    group: assets-companions
    description: "A horse rideable by up to 2 people. While equipped, gives riders 1 extra free zone move each turn at the cost of being more easily noticed by others. Cannot be used in the Caves. Consumes 1 ⬢ per day."
    pointCost: 9
    tradeable: true
    stackable: true
    equippable: true
    equipSlot: MOUNT
    equipLayer: 1
    purchasable: true
    visible: true
    purchasableAfterStart: false
    # The Merchant is the only mid-game source, so the price is meant to hurt:
    # a free zone move every turn is the strongest thing on the assets shelf.
    depotPrice: 84
    sellable: true
    sellablePrice: 54
    craftable: true
    # Reproduction. Keeps the mare — `keep: true` — and spends a Lavish Meal
    # instead of ⬢: a Lavish Meal always needs a real errand (tea/sweets/honey/
    # fish roe, three of them Depot imports), which is the actual throttle on
    # breeding a line of horses out of nothing. `customOf:` reaches a Lavish
    # Meal because a cooked one never keeps the `lavish-meal` slug — it mints
    # fresh every time (COOKING.md) — see db/lib/tagShapes.js.
    requirement:
      turnsCost: 1
      resourceCost: 4
      gambit: false
      items:
        - tag: horse
          keep: true
        - customOf: lavish-meal
      skills: [arelitz-breeding]

