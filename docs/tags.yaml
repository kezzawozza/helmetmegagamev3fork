  # --- The drinking ladder (docs/systemdocs/BREWING.md) --------------------
  #
  # Three rungs, and every drink in the catalog still consumes into the first
  # one. `escalatesInto` is what makes the second drink matter: consuming
  # something that grants a rung you already hold clears that rung and gives
  # you the one above instead. So tipsy -> wasted -> unconscious, and the only
  # way down is to stop.
  #
  # The Fighting penalties below are ordinary generic `fighting:` blocks, not
  # special cases: no line of code branches on `tipsy`. The one place a rung is
  # named by slug is Drunken Master's `holdsAny`, which is a catalog entry too.
  tipsy:
    catalog: gm
    name: Tipsy
    category: status
    group: status-debuffs
    description: "You feel warm, but a bit uncoordinated."
    fighting: { tree: both, tiers: -0.5 }
    pointCost: 0
    visible: true
    purchasable: false
    durationTurns: 1
    escalatesInto: wasted

  wasted:
    catalog: gm
    name: Wasted
    category: status
    group: status-debuffs
    description: "You are in a bit of a stupor and are having trouble controlling your body."
    fighting: { tree: both, tiers: -1.2 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1
    escalatesInto: unconscious
    expiresInto: [hangover]

  # In INCAPACITATING_SLUGS (db/lib/incapacitation.js): out cold is out cold,
  # so you can be looted, dragged and tied up where you fell. Deliberately NOT
  # in FINISHABLE_SLUGS — passing out in a tavern should not be a
  # no-confirmation death sentence, the same call already made for Seizure.
  unconscious:
    catalog: gm
    name: Unconscious
    category: status
    group: status-debuffs
    description: "You drank yourself into unconsciousness."
    fighting: { tree: both, cap: pitiful }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1
    expiresInto: [hangover]

  # The Iron Liver marker: the first drink at a rung sets it, the second
  # clears it and climbs. web/lib/consumeGrants.js.
  holding-it-down:
    catalog: gm
    name: Holding It Down
    category: status
    group: status-debuffs
    description: "You're holding it down. One more and you won't be."
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1

  # The bottom of the ladder rather than a rung on it: no escalatesInto, so
  # drinking through a hangover starts you over at Tipsy.
  hangover:
    catalog: gm
    name: Hangover
    category: status
    group: status-debuffs
    description: "Ugh…"
    fighting: { tree: both, tiers: -0.5 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1

  # Recreational intoxication, and deliberately a Status tag with NO
  # mechanical effect at all — unlike Tipsy above, which really does dull a
  # fight. High is a roleplaying state and something a GM
  # may weigh when adjudicating, nothing more. Its duration is set by whatever
  # produced it rather than by the number below: raw Cave Fungus leaves you
  # High for 2 turns, refined Bliss for 3, via the per-grant override in
  # consumesIntoDurations (see this file's header). The 2 here is only the
  # fallback for a grant that doesn't say.
  # --- Tonic effects ------------------------------------------------------
  # What the apothecary in items-drink turns into. None is purchasable and
  # none is removable by hand: you get these by drinking something, and they
  # run out on their own clock.
  night-vision:
    catalog: gm
    name: Night Vision
    category: status
    group: status-buffs
    description: "You can see in the dark as though it were an overcast day."
    fighting: { situational: true }
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 2

  # Eating Flesh of Tzchernobog. Two turns of being able to chant a rite that
  # counts (db/lib/riteChant.js#chanterReady) — the other half of that gate is
  # wearing black-robes. Bascinet's wording.
  dark-inspiration:
    catalog: gm
    name: Dark Inspiration
    category: status
    group: status-buffs
    description: "Crudox Cruo! You can cast rites."
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 2

  # The Fertilizer's effect half (SOILERY.md's Addendum). Its old +8 ⬢
  # laborBonus is gone with the rest of Laboring (upstream's "Strip Laboring"
  # pass) — nothing here replaces it, since the mechanic it boosted no
  # longer exists. What survives is the crop-yield half, unrelated to
  # Laboring: db/lib/soilery.js#reap reads this tag directly.
  fertilized-fields:
    catalog: gm
    name: Fertilized Fields
    category: status
    group: status-buffs
    description: "You have nourished the earth upon which you plant, the harvest will surely be bountiful!"
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 2

  opium-high:
    catalog: gm
    name: Opium High
    category: status
    group: status-debuffs
    description: "You can't feel pain and can't think clearly. Your fighting skill counts as 1 tier lower."
    fighting: { tree: both, tiers: -1 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 2

  pain-immunity:
    catalog: gm
    name: Pain Immunity
    category: status
    group: status-buffs
    description: "You can't feel pain. What an odd sensation!"
    fighting: { tree: both, tiers: 0.5 }
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 2

  brutish-strength:
    catalog: gm
    name: Brutish Strength
    category: status
    group: status-buffs
    description: "You possess impossible strength."
    fighting: { tree: melee, tiers: 2 }
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 2

  increased-accuracy:
    catalog: gm
    name: Increased Accuracy
    category: status
    group: status-buffs
    description: "You have steady hands and sharper vision. It's easier for you to hit what you aim for."
    fighting: { tree: ranged, tiers: 2 }
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 2

  increased-recovery:
    catalog: gm
    name: Increased Recovery
    category: status
    group: status-buffs
    description: "Your body heals faster than it normally should, and infections take longer to hurt you."
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 2

  # Push on (MAP.md §3): keeps the better of two dice — db/lib/locationTravel.js.
  invisible:
    catalog: gm
    name: Invisible
    category: status
    group: status-buffs
    description: "Light and eyes go right through you."
    fighting: { tree: both, tiers: 2, situational: true }
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 2

  aberrant-luck:
    catalog: gm
    name: Aberrant Luck
    category: status
    group: status-buffs
    description: "Every Gambit you roll is an automatic 6."
    fighting: { situational: true }
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 3

  pheromones:
    catalog: secret
    name: Pheromones
    category: status
    group: status-buffs
    description: "You smell like a Nekker. Nekkers ignore you."
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 4

  alluring-scent:
    catalog: gm
    name: Alluring Scent
    category: status
    group: status-buffs
    description: "You smell good!"
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 2

  # For targets of Mesmer Glass, GM applied
  flashed:
    catalog: gm
    name: Flashed
    category: status
    group: status-debuffs
    description: "Ow! What was that?! You're temporarily blinded!"
    fighting: { tree: both, tiers: -3 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1

  # A caves tag. Something down there has your scent and is following it.
  hunted:
    catalog: gm
    name: Hunted
    category: status
    group: status-debuffs
    description: "Something's caught your trail!"
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 2

  # The five fear bands used to sit here — Uncomfortable, Stressed, Anxious,
  # Afraid and Panic, projected onto a sheet from the hidden dial. They are
  # gone: the mood dial (docs/systemdocs/MOOD.md) is one number and the band is
  # a WORD read off it in its own box on the sheet, so there is nothing left
  # for a tag row to do. The rows still on live sheets come off with
  # `npm run db:prune-tags -- --apply`.

  # For Disabler
  disabled-slowed:
    catalog: gm
    name: Disabled (Slowed)
    category: status
    group: status-debuffs
    description: "You took a few disabler shots. It's hard to keep standing."
    fighting: { tree: both, tiers: -1.5 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false

  disabled-shocked:
    catalog: gm
    name: Disabled (Shocked)
    category: status
    group: status-debuffs
    description: "Your muscles are cramping. You feel weak and dizzy, and you can't move."
    fighting: { tree: both, cap: pitiful }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1

  high:
    catalog: gm
    name: High
    category: status
    group: status-debuffs
    description: "You feel pleasantly adrift."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 2

  # What refined Bliss leaves behind, on top of the High the raw fungus gives.
  # Like High it carries no mechanical effect — it is a roleplaying state and a
  # thing a GM may weigh, nothing more.
  euphoric:
    catalog: gm
    name: Euphoric
    category: status
    group: status-debuffs
    description: "You could do this for the rest of your life."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 3

  # The drug highs (docs/systemdocs/BREWING.md). Each one is the STATE half of
  # an item on the Silver Chip shelf, the same split every consumable in this
  # file uses — you swallow the tablet, you hold the high.
  #
  # None of them carries its mood here, and that is not an oversight: a drug
  # restores no hunger, so the consume path never reads `cooked.mood` for one.
  # What a drug does to the dial is a row in CONSUME_RELIEF (db/lib/mood.js),
  # and Heroin and Changa do not use that either — they SET the dial rather
  # than adding to it, which no authored field can express.
  dissociated:
    catalog: gm
    name: Dissociated
    category: status
    group: status-debuffs
    description: "This feels strange."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1

  # The only tag in the game that can kill you by running out. `oneOf` is an
  # even pick and `dead` is the reserved token (db/lib/tagShapes.js), so this
  # is a true 50/50 with no code behind it: three turns of being the happiest
  # person in Ravenheart, then a coin toss between a Seizure and the end.
  #
  # The max-mood pin is NOT here — a tag cannot author "set my holder to
  # MOOD_MAX every turn". It lives beside Imperturbable's pin-to-Fine in
  # db/lib/mood.js#applyMoodTerms, and the slug is in MULTIPLIER_SLUGS so the
  # nightly pass actually loads it.
  changa-high:
    catalog: gm
    name: Changa High
    category: status
    group: status-buffs
    description: "You are losing your mind and going crazy. You might die."
    fighting: { tree: melee, tiers: 1 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 3
    expiresInto: [{ oneOf: [seizure, dead] }]

  # What Changa is once somebody has refined the madness out of it: the same
  # strength, none of the coin toss.
  buffout-high:
    catalog: gm
    name: Buffout High
    category: status
    group: status-buffs
    description: "You feel wired and intense."
    fighting: { tree: melee, tiers: 1.5 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 2

  # Heroin's other half. The dial goes to the top and the body goes slack.
  doped:
    catalog: gm
    name: Doped
    category: status
    group: status-debuffs
    description: "You feel tranquil and tired."
    fighting: { tree: both, tiers: -0.5 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1

  # The one appearance-ish bonus that is NOT crossed. Pretty, Beautiful and
  # Seductive all pay the person you kiss and never yourself (db/lib/kiss.js);
  # a Love Tablet pays both, so one tablet between two people is enough. That
  # exception is written in kiss.js, not here.
  in-love:
    catalog: gm
    name: In Love
    category: status
    group: status-buffs
    description: "Your kisses make both you and the other person very happy."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 3

  # The effect half of the Flawless Skin tonic — the tonic is an Item you
  # drink, this is the state it leaves behind. Split in two because that's how
  # every consumable in this file works (Fine Meal -> Ate Meal), and because
  # only the state should ever expire. Named for the effect rather than the
  # bottle so the two don't collide: docs/documents.yaml matches tags by NAME,
  # and two rows called Flawless Skin would be a coin toss.
  otherworldly-beauty:
    catalog: gm
    name: Otherworldly Beauty
    category: status
    group: status-buffs
    description: "You are peerless in your beauty."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 3

  drained:
    catalog: gm
    name: Drained
    category: status
    group: status-debuffs
    description: "You're weakened, unable to eat enough or push yourself physically."
    fighting: { tree: both, tiers: -1.5 }
    pointCost: 0
    purchasable: false
    durationTurns: 3

  # What a 6 on the push on leaves (MAP.md §3, db/lib/locationTravel.js#pushOn):
  # a turn's visible mark and no effect at all. Granted at N, not N+1 like the
  # fatigue tags: it only says you pushed on today, so the sweep clears it
  # when this turn closes. Description is Bascinet's own wording.
  winded:
    catalog: gm
    name: Winded
    category: status
    group: status-debuffs
    description: "You're not tired, you just need to catch your breath."
    pointCost: 0
    purchasable: false
    visible: true
    durationTurns: 1

  # The precursor to Exhausted (db/lib/fatigue.js). Granted by a day's mining,
  # a bad night's sleep (Guilt Ridden, Insomniac) or pushing on (MAP.md §3).
  # Doesn't block anything by itself — a second day, a second bad night or a
  # second push escalates it straight to Exhausted instead of refreshing this.
  # Left alone, it clears on its own — durationTurns: 1 the same way
  # Exhausted's does, so it only survives into the very next turn.
  tired:
    catalog: gm
    name: Tired
    category: status
    group: status-debuffs
    description: "You worked hard, or slept badly. Push yourself again and you'll wear yourself out."
    fighting: { tree: both, tiers: -0.5 }
    pointCost: 0
    purchasable: false
    durationTurns: 1

  # The escalated half of the same ladder (db/lib/fatigue.js). Reached by a
  # day's mining, a bad night's sleep or pushing on (MAP.md §3) while already
  # Tired — two days running, or two bad nights running — or straight away
  # on a 2–3 when pushing on. durationTurns: 1 is what makes the clock work:
  # granted while turn T closes, it blocks turn T+1 and degrades back into
  # Tired when T+1 closes.
  exhausted:
    catalog: gm
    name: Exhausted
    category: status
    group: status-debuffs
    description: "You've pushed too far. You can't Labor again until you rest, and you won't fight well like this."
    fighting: { tree: both, tiers: -1.5 }
    pointCost: 0
    purchasable: false
    durationTurns: 1
    expiresInto: [tired]

  # Over a carry cap. Granted and cleared by db/lib/carry.js#settleCarry —
  # never by a player, never on a clock — and read by the zone-crossing gate
  # in db/lib/locationTravel.js. Description is Bascinet's own wording.
  overburdened:
    catalog: gm
    name: Overburdened
    category: status
    group: status-debuffs
    description: "You're overburdened. You can't freely change zones."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false

  # Two effects the Merchant's imported goods produce (docs/systemdocs/DEPOT.md
  # §3). Neither is bought or brewed: Caffeinated is what a cup of Coffee
  # consumes into, and Asleep is what a Soporific does to whoever drinks it —
  # so both live here with the other tonic effects rather than in Items.
  # Push on (MAP.md §3): keeps the better of two dice — db/lib/locationTravel.js.
  caffeinated:
    catalog: gm
    name: Caffeinated
    category: status
    group: status-buffs
    description: "You're full of energy and always alert."
    fighting: { tree: both, tiers: 0.5 }
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 2

  asleep:
    catalog: gm
    name: Asleep
    category: status
    group: status-debuffs
    description: "You're dreaming."
    fighting: { tree: both, cap: pitiful }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1

  # === Health ===========================================================
  # Afflictions. Priced off the eight-rung cure ladder in this file's header
  # — pick a rung and copy its block, don't invent numbers. Two conventions
  # every entry below follows:
  #
  #   * A tag that GETS WORSE says so in its own description, and names what
  #     it becomes. expiresInto does the mechanics; the sentence is what
  #     makes a player go find a doctor before the timer runs out.
  #   * `visible` is realism, not severity. A gaping wound or a missing arm
  #     is obvious to anyone; appendicitis, cracked ribs and a rotten liver
  #     are not. Whoever can treat a thing as routine sees it anyway, even
  #     when it's invisible — that's the doctor's eye
  #     (db/lib/medicalVision.js), and it's why the internal cases are worth
  #     hiding rather than just flagging everything visible.

  # --- Infection ---------------------------------------------------------
  infected:
    catalog: all
    name: Infected
    category: health
    group: health-infection
    cureRung: 2
    description: "Your wound is hot and draining pus. You could amputate it."
    fighting: { tree: both, tiers: -0.5 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1
    expiresInto: [festering]
    healable: true
    requirement:
      turnsCost: 0.25
      resourceCost: 2
      skills: [medical-basic]

  festering:
    catalog: all
    name: Festering
    category: health
    group: health-infection
    cureRung: 4
    description: "The flesh around your wound has gone soft and gives off an odor. You could amputate it."
    fighting: { tree: both, tiers: -1 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1
    expiresInto: [feverish, necrosis]
    removesInto: [recovering]
    healable: true
    requirement:
      turnsCost: 0.25
      resourceCost: 4
      skills: [medical-skilled]

  feverish:
    catalog: all
    name: Feverish
    category: health
    group: health-infection
    cureRung: 5
    description: "You're burning up. The infection is in your blood…"
    fighting: { tree: both, tiers: -1.5 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1
    expiresInto: [sepsis]
    removesInto: [recovering]
    healable: true
    requirement:
      turnsCost: 0.5
      resourceCost: 7
      skills: [medical-skilled]

  necrosis:
    catalog: all
    name: Necrosis
    category: health
    group: health-infection
    cureRung: 5
    description: "It's gone."
    fighting: { tree: both, tiers: -1.5 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 2
    expiresInto:
      - oneOf: [missing-leg, missing-arm]
    removesInto: [cauterized]
    healable: true
    requirement:
      turnsCost: 0.5
      resourceCost: 7
      skills: [medical-skilled]

  # Refuses a push on (MAP.md §3, EXERT_REFUSAL_SLUGS in db/lib/locationTravel.js).
  sepsis:
    catalog: all
    name: Sepsis
    category: health
    group: health-infection
    cureRung: 7
    description: "Your body is shutting down. You're not lucid."
    fighting: { tree: both, tiers: -2 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1
    # Also expires into itself (TAGS.md §5c): Dying is a cheap rescue on
    # purpose, and without this Sepsis would simply vanish for free the
    # moment Dying is cured, leaving nothing left at its own 13 ⬢ rung.
    expiresInto: [dying, sepsis]
    removesInto: [recovering, drained]
    healable: true
    requirement:
      turnsCost: 1
      resourceCost: 13
      skills: [medical-expert]
      gambit: true

  dying:
    catalog: all
    name: Dying
    category: health
    group: health-infection
    cureRung: 7
    description: "You're on death's door."
    fighting: { tree: both, cap: pitiful }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    # The one duration in the catalog that is a countdown to death rather than
    # to recovery. Nothing turns Dying into anything (no expiresInto): the
    # Dying death pass reads this clock and kills at the close instead. See
    # db/lib/dyingDeathPass.js and TAGS.md §5c.
    durationTurns: 1
    removesInto: [recovering, drained]
    healable: true
    requirement:
      turnsCost: 1
      resourceCost: 13
      skills: [medical-expert]
      gambit: true

  # The end of the line. Not a wound and not curable — a marker on a sheet
  # whose owner was vaporised outright by one of the Thanati rites or by the
  # bomb (db/lib/characterDeath.js, the `gib` option). Every other tag the
  # character held is deleted when this one lands, and no corpse is minted, so
  # there is nothing left to loot, carry, butcher or bury.
  gibbed:
    catalog: all
    name: Gibbed
    category: health
    group: health-infection
    cureRung: 0
    description: "Vaporized."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    healable: false

  # --- Wounds ------------------------------------------------------------
  bruised:
    catalog: all
    name: Bruised
    category: health
    group: health-wounds
    cureRung: 1
    description: "Your wound is tender and purple, but it'll heal."
    fighting: { tree: both, tiers: -0.3 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1
    healable: true
    requirement:
      turnsCost: 0
      resourceCost: 1
      skills: [medical-basic]

  sprained-ankle:
    catalog: all
    name: Sprained Ankle
    category: health
    group: health-wounds
    cureRung: 2
    description: "You can walk, but it's a struggle. Wrapping your wound with a splint would help."
    fighting: { tree: both, tiers: -0.5 }
    pointCost: 0
    carryBonus: -0.05
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 3
    removesInto: [recovering]
    healable: true
    requirement:
      turnsCost: 0.25
      resourceCost: 2
      skills: [medical-basic]

  burned:
    catalog: all
    name: Burned
    category: health
    group: health-wounds
    cureRung: 2
