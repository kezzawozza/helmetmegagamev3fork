    equipSlot: WEAPON
    weight: 0.5
    stackable: true
    visible: worn
    purchasable: true
    purchasableAfterStart: false
    craftable: true
    customizable: true
    customizableSkill: smithing-skilled
    requirement:
      turnsCost: 0.25
      resourceCost: 3
      skills: [smithing]
      gambit: false
