    category: general
    group: general-traits
    description: "No shelter, no problem. Being outside doesn't bother you."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  outsider:
    catalog: all
    name: Outsider
    category: general
    group: general-traits
    requiredTag: rough-camper
    description: "Being in the wilderness doesn't bother you at all."
    pointCost: 1
    purchasable: true
    purchasableAfterStart: true

  spelunker:
    catalog: all
    name: Spelunker
    category: general
    group: general-traits
    requiredTag: rough-camper
    description: "Being in the caves doesn't bother you at all."
    pointCost: 1
    purchasable: true
    purchasableAfterStart: true

  game-master:
    catalog: all
    name: Game Master
    category: general
    group: general-traits
    description: "You are a master at table games, and slightly better at real-life tactics."
