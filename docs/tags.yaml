  # ─── The Combat Update ────────────────────────────────────────────────────
  # Weapons are priced on the six-tier ladder from SMITHING.md:
  #
  #   Dead Simple    2 pt / 3 ⬢  / 0 turns / crafting OR smithing / no weapon skill
  #   Simple         5 pt / 6 ⬢  / 1 turn  / smithing             / melee-/ranged-basic
  #   Moderate       7 pt / 14 ⬢ / 1 turn  / smithing-skilled     / melee-/ranged-basic
  #   High Quality   9 pt / 26 ⬢ / 2 turns / smithing-skilled     / melee-/ranged-basic
  #   Exceptional   14 pt / 34 ⬢ / 3 turns / smithing-skilled     / melee-/ranged-basic
  #   Gunpowder     14 pt / 29 ⬢ / 2 turns / smithing-gunpowder   / ranged-basic
  #
  # Bows / crossbows keep `crafting` in place of `smithing` at every tier —
  # wood-and-sinew is still wood-and-sinew even at High Quality.
  #
  # Four small pieces of metalwork — spear, dagger, silver-knife,
  # phrygian-spear — run under the Simple rung's turn: turnsCost 1/3, three
  # to a Routine, a spearhead or a knife not being a day at the anvil (Chris
  # 2026-09-07). They sell at 7, not the tier's 9: the markup formula rounds
  # to 0 at 1/3 turn, so they keep Dead Simple's flat +1 instead — see
  # DEPOT.md §4. Everything else (6 ⬢, pt, skill, forge) is the tier's.
  #
  # ─── Dead Simple ───────────────────────────────────────────────────────────

  trench-knife:
    catalog: all
    name: Trench Knife
    category: items
    group: items-weapons
    description: "A deadly knife with brass knuckles embedded on the grip. While equipped, torture-related Gambits gain +1."
    fighting: { tiers: 0.3, weaponClass: knife }
    pointCost: 5
    requiredTag: melee-basic
    equippable: true
    equipSlot: WEAPON
    tradeable: true
    weight: 1
    stackable: true
    visible: worn
    purchasable: true
    purchasableAfterStart: false
    craftable: true
    requirement:
      turnsCost: 1
      resourceCost: 8
      skills: [smithing]
      gambit: false
    sellable: true
    sellablePrice: 20
  # A `customizableSkill: smithing-skilled` below is the +1 ⬢ door onto a
  # smith's own name and words (CRAFTING.md §4a), and the rung it names is
  # who may open it — the top of the Smithing ladder, whatever tier the piece
  # itself is. Only the plain arms carry it: a mace, a broadsword, a spear.
  # The named and exotic pieces do not, and neither does anything whose slug
  # some rule reads back — Trench Knife's torture bonus is keyed to its exact
  # slug (db/lib/torture.js), which a mint never matches.
  work-knife:
    catalog: all
    name: Work Knife
    category: items
    group: items-weapons
    description: "A good knife, hard to handle in battle."
    fighting: { tiers: 0.1, weaponClass: knife }
