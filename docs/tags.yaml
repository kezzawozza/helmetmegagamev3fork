    requirement:
      turnsCost: 1
      resourceCost: 3
      skills: [brewing-expert]
      gambit: false
      items: [antidote, fever-draught, brackenmoss]
    sellable: true
    sellablePrice: 28

  # A creation-only bundle rather than a thing you carry: it sits on the sheet
  # until the player unpacks it from their own character sheet (see consumable
  # in this file's header). Not tradeable or stackable — there's nothing to
  # hand over, and buying two would just collapse into one.
  starting-wares:
    catalog: all
    name: Starting Wares
    category: items
    group: items-gear
    description: "Goods you came in with, still crated. Unpack them whenever you like. [This is a small trader's stock, should you wish to go into business. Its real value is in what you can talk somebody into paying for it.]"
    pointCost: 14
    tradeable: true
    weight: 12
    purchasable: true
    purchasableAfterStart: false
    consumable: true
    # Priced by what it unpacks into, the rule TAGS.md §4a sets for every
    # consumable and the rule this tag was caught breaking once already:
    # 2 Jewelry (1 pt each) + Instant Camera (1) + Sword Cane (3) = 6 pt.
    #
    # The 0-pt goods after those cost nothing on the scale and are the point
    # of the rebuild — a would-be trader now opens the crate onto actual
    # stock to haggle over, instead of a revolver. The comforts among them are
    # ordinarily Depot-only (docs/systemdocs/DEPOT.md §3), which is exactly
    # right: you brought them in with you, the same way the Merchant does.
    # Nothing here is hardware, so this is not a back door to his real shelf.
    consumesInto:
      - jewelry
      - jewelry
      - instant-camera
      - sword-cane
      - old-coin
      - old-coin
      - tea
      - coffee
      - sake
      - sweets

  # A crate sitting in the Merchant's Cargo Bay. The Depot's real crates are
  # runtime Tag rows minted per shuttle (docs/systemdocs/DEPOT.md §5), which a
  # YAML stash cannot name — so the one that is simply THERE at the start is
  # an ordinary authored consumable, the same shape as Starting Wares above.
  # Heavy, because it is a crate: carrying one off is a decision.
  # --- Commoner kits ------------------------------------------------------
  # A Commoner starts skilled at labor and nothing else. These are the three
  # trades, sold as a crate you consume rather than as loose tags, so the
  # picker offers one decision instead of four. Same shape as starting-wares
  # above.
  #
  # `onlyRoles: [commoner]` is load-bearing, not flavour. Each kit holds far
  # more than it costs — the Fisherman is 11 points of tags for 1, the Farmer 9
  # for 0, the Hunter 14 for 2 — because a Commoner picking a trade should be
  # nearly free. Ungated, that is a faucet every seat could pull at creation for
  # most of a second build.
  commoner-fisherman:
    catalog: all
    name: "Commoner: Fisherman"
    category: items
    onlyRoles: [commoner]
    conflictsWith: [commoner-farmer, commoner-hunter]
    group: items-gear
    description: "Live off the rivers of Ravenheart. Gives a {tag:fishing-boat} and {tag:laboring-fishing}."
    pointCost: 1
    tradeable: true
    weight: 2
    purchasable: true
    purchasableAfterStart: false
    consumable: true
    consumesInto:
      - fishing-boat
      - laboring-fishing

  commoner-farmer:
    catalog: all
    name: "Commoner: Farmer"
    category: items
    onlyRoles: [commoner]
    conflictsWith: [commoner-fisherman, commoner-hunter]
    group: items-gear
    description: "Live off the land of Ravenheart. Gives a {tag:work-knife} and {tag:laboring-farming}."
    pointCost: 0
    tradeable: true
    weight: 1
    purchasable: true
    purchasableAfterStart: false
    consumable: true
    consumesInto:
      - work-knife
      - laboring-farming

  commoner-hunter:
