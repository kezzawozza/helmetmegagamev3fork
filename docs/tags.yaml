  #
  # ONE BELIEF PER CHARACTER, enforced by `exclusive: true` below. A character
  # may hold at most one exclusive tag — the one exception being a pair joined
  # by requiredTag, which is how Fundamentalist stacks on Post-Christian.
  # Checked at creation, at /store checkout and in the Add Tag request; a GM
  # grant bypasses it like every other gate. Pilgrim and Saint sit in this same
  # group and are deliberately NOT exclusive: they stack on top of a belief.
  # See docs/systemdocs/TAGS.md §5.
  #
  # A belief cannot be dropped from the sheet. Destroy is for items now
  # (docs/systemdocs/CRAFTING.md §5), and these are not items, so converting
  # mid-game is a GM's to make rather than a thing a player does by buying
  # over the top of one. That also closes the farm the old pairing had to
  # argue its way out of: there is no drop step left to repeat.
  #
  # None is `visible`. You cannot tell an Atheist from a Post-Christian by
  # looking, and docs/tag-design.md sets that flag by whether a bystander
  # actually could. A belief is meant to come out in play, not off a inspect.
  post-christian:
    catalog: all
    name: Post-Christian
    category: general
    group: general-beliefs
    description: "You are protected by God. A reasonable decision, and potentially a path to Heaven."
    pointCost: 0
    purchasable: true
    purchasableAfterStart: true
    exclusive: true

  atheist:
    catalog: all
    name: Atheist
    category: general
    group: general-beliefs
    description: "You have abstained from choosing a religion, a choice in its own right."
    pointCost: 0
    purchasable: true
    purchasableAfterStart: true
    exclusive: true

  existentialist:
    catalog: all
    name: Existentialist
    category: general
    group: general-beliefs
    description: "You walk on firm ground — if you can be sure of one thing, it's of your responsibility."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true
    exclusive: true

  # Sign flip 2026-08-31 (Desires rework): removed and re-added under the
  # same slug as a +2 Interest rather than a -2 drawback. Existing holders
  # are grandfathered — they keep it free, no clawback.
  fundamentalist:
    catalog: all
    name: Fundamentalist
    category: general
    group: general-beliefs
    description: "Unlocks desires related to zealotry."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true
    requiredTag: post-christian
    exclusive: true

  old-ways-eusoch:
    catalog: all
    name: Old Ways (Eusoch)
    category: general
    group: general-beliefs
    description: "The healer, the compassionate, the prolonger of life."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true
    exclusive: true

  old-ways-sylvia:
    catalog: all
    name: Old Ways (Sylvia)
    category: general
    group: general-beliefs
    description: "The forest was here before us. Hear the cicadas, hearkening the storm."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true
    exclusive: true

  old-ways-thoth:
    catalog: all
    name: Old Ways (Thoth)
    category: general
    group: general-beliefs
    description: "The boldness of excellence, inspiration, and artistic magnificence."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true
    exclusive: true

  #Unrelated to the formal bacchus cult
  old-ways-bacchus:
    catalog: all
    name: Old Ways (Bacchus)
    category: general
    group: general-beliefs
    description: "A distant, mostly superstitious regard for Bacchus the Fertile, Bacchus the Shameless."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true
    exclusive: true

  # The fifth Old Way, and the only one nobody can buy: it is handed out by the
  # Pray button in the Shrine of an Old Man (docs/zones.yaml, depths-chasm) and
  # by nothing else. Holding it puts the character on db/lib/xomPass.js's
  # weighted table, once per turn close, for the rest of their life —
  # see docs/systemdocs/TURN-ENGINE.md.
  #
  # `visible` stays at its default (hidden), unlike {tag:rage}, which is
  # visible because Rage is plainly happening to you. This is a secret, and one
  # inspect reaction would be the end of it.
  #
  # The lock leaves exactly one Desire standing, the way {tag:stupid} and
  # {tag:thanati} do — see the `chaos` family in docs/desires.yaml.
  old-ways-xom:
    catalog: secret
    name: Old Ways (Xom)
    category: general
    group: general-beliefs
    description: "The patron god of chance and disorder, as mad as those who willingly become his playthings."
    pointCost: 0
    purchasable: false
    purchasableAfterStart: false
    exclusive: true
    desires:
      locks:
        - all: true
          exceptFamilies: [chaos]

  # Pilgrim is deliberately off the point scale at 1 — Gunboat's call.
  pilgrim:
    catalog: all
    name: Pilgrim
    category: general
    group: general-beliefs
    description: "Unlocks desires related to religion."
    pointCost: 1
    purchasable: true
    purchasableAfterStart: true

  saint:
    catalog: all
    name: Saint
    category: general
    group: general-beliefs
    description: "You are at peace. Twice a turn, you can instantly cure someone else's Moderate or lesser wound (refer to the Medical document). You cannot fight anyone, not even in self-defense. You'd rather let yourself be killed."
    fighting: { situational: true }
    pointCost: 14
    visible: true
    # Migrants only: Pale is the Migrant role's starting tag and is
    # purchasable: false, so nobody else can pick it up.
    requiredTag: pale
    purchasable: true
    purchasableAfterStart: true

  # The Thanati creed. A Belief like the others — exclusive, so a convert
  # drops whatever they held — but never bought: it arrives with the Thanati
  # seats (db/lib/threats.js) or from a GM's hand. `secret` keeps it out of
  # the player's Tag Catalog. Pilgrim and Saint are not exclusive, so they are
  # named here; every other Belief is ruled out by the group. Bascinet's
  # wording.
  thanati:
    catalog: secret
    name: Thanati
    category: general
    group: general-beliefs
    description: "Crudux Cruo! You must serve your master Tzchernobog to be rewarded with a better life after this one! View the Thanati document for further information and instructions. Good luck."
    pointCost: 0
    purchasable: false
    purchasableAfterStart: false
    exclusive: true
    conflictsWith: [pacifist, charitable, saint, pilgrim]
    # A cultist wants what the cult wants, and past that only the ugly things.
    # The blood families stay open because hurting people is most of what a
    # Thanati actually does; everything else — dinner, romance, a promotion —
    # stops being a thing they can be rewarded for. Shaped like {tag:rage}'s.
    desires:
      locks:
        - all: true
          exceptFamilies: [thanati, cruelty, violence, feud, betrayal]

  # --- The Cerberon ---------------------------------------------------------
  cerberon:
    catalog: gm
    name: Cerberon
    category: general
    group: general-traits
    description: "You are sworn to the Cerberon. You guard access to the Fortress and uphold order."
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false

  # Sign flip 2026-08-31 (Desires rework); moves OUT of general-cerberon into
  # general-interests, ungated — the cerberon/sheriff OR-gate lives on its
  # Desires (take-a-bribe), not on the tag itself. Text unchanged.
  # Grandfathered — see Superstitious.
  corrupt:
    catalog: all
    name: Corrupt
    category: general
    group: general-personality
    description: "The good old ways. You prioritize making yourself comfortable above all else. Unlocks Desires about corruption."
    pointCost: -2
    # Stated rather than left to the default. TAGS.md §4a: a drawback the store
    # PAYS for must be one that can never be handed back, or it is a point
    # farm. This is the only tag in the file that relies on that rule, so the
    # flag is written out.
    visible: false
    purchasable: true
    purchasableAfterStart: false
    # The four Cerberon roles and the Sheriff — the people with something to
    # sell. Corruption is a betrayal of a post, so it needs a post to betray:
    # a bum who prioritizes his own comfort is just a bum. The same five the
    # corrupt Desires gate on (docs/desires.yaml §4e).
    onlyRoles: [incarn, cerberus, censor, squire, sheriff]

  houndmaster:
    catalog: gm
    name: Houndmaster
    category: general
    group: general-cerberon
    description: "You're excellent at handling dogs. Under your usage, the kennel's {tag:hound}s fight and track even better."
    fighting: { situational: true }
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  sergeant:
    catalog: gm
    name: Sergeant
    category: general
    group: general-cerberon
    description: "You have rank, which doesn't necessarily mean much."
    pointCost: 2
    visible: false
    purchasable: true
    purchasableAfterStart: true

  # Reads against the Teaching Skills document (docs/documents.yaml), which
  # sets the untaught baseline at a 6. Change one and change the other.
  # Teaching (Drill Instructor) replaced the old Drillmaster here in 9/2026.
  # A Skill like the rest of the Teaching tree, but it keeps the Cerberon
  # group so the group's `requiredTag: cerberon` gates it: the Cerberi and the
  # Censor (who starts with the Cerberon tag) can take it, nobody else can.
  # PointBuy tabs by the tag's own category, so it shows under Skills. The
  # tag's own requiredTag slot is spent on Teaching. Not teachable.
  teaching-drill-instructor:
    catalog: gm
    name: Teaching (Drill Instructor)
    category: skills
    group: general-cerberon
    requiredTag: teaching
    description: "When someone tries to learn a fighting skill from you, they succeed on a 4, 5, or a 6."
    pointCost: 3
    visible: false
    purchasable: true
    purchasableAfterStart: true
    teachable: false

  # --- The general MASTERIES -------------------------------------------------
  # Five capstones, none of them buyable at character creation (TAGS.md 4a on
  # the mastery band and why it sits above the ordinary 14-point ceiling).
  # Second Wind is filed with them because it reads like one, but it is a plain
  # 6-point tag and is deliberately NOT `mastery` — it can be bought at
  # creation like anything else.

  # Advantage is a re-roll, not a modifier, so it does not live in
  # db/lib/gambitModifier.js — db/lib/advantage.js is the whole mechanic, and
  # every d6 a CHARACTER rolls goes through it.
  lucky:
    catalog: all
    name: Lucky
    category: general
    group: general-traits
    description: "Fortune leans your way. You roll every Gambit twice and keep the better die, the Caving Die and the laboring die included."
    pointCost: 15
    visible: false
    purchasable: true
    purchasableAfterStart: true
    mastery: true

  # The SLOT lock only (GameConfig.desireSlotLockTurns), never a Desire's own
  # cooldown — a Manic character may refill a slot the turn it empties, but
  # each individual Desire still waits out its own timer (DESIRES.md).
  manic:
    catalog: all
    name: Manic
    category: general
    group: general-personality
    psychological: true
    description: "Your Desire slots don't have a cooldown. However, your available desires are randomized every turn."
    pointCost: 10
    visible: false
    purchasable: true
    purchasableAfterStart: true
    mastery: true

  # On death this rolls the holder straight into a new body: a random role with
  # a free seat, the starting budget plus 6, and no Curse. See CHARACTERS.md.
  # The description is deliberately vague — the player is told what it does by
  # DM when they take it, not by the catalog line.
  metempsychosis:
    catalog: all
    name: Metempsychosis
    category: general
    group: general-traits
    description: "You know something important. You can respawn freely and infinitely, and you remember certain things about your past lives. You don't remember who killed you or your cause of death."
    pointCost: 12
    visible: false
    purchasable: true
    purchasableAfterStart: true
    mastery: true

  # A negative factor in db/lib/mood.js MULTIPLIERS, which flips harm into
  # relief. Shocks pay HALF their sting back as mood; the ever-present costs
  # (wilderness, caves, hunger) simply stop landing.
  amor-fati:
    catalog: all
    name: Amor Fati
    category: general
    group: general-beliefs
    description: "Unfortunate incidents only serve to make you pleased. What would wound another man's spirits lifts yours instead, and the ordinary miseries do not touch you at all."
    pointCost: 12
    visible: false
    purchasable: true
    purchasableAfterStart: true
    mastery: true
    conflictsWith: [imperturbable]

  # Pinned at Fine: the mood dial cannot move at all, in either direction. That
  # costs the Ecstatic Gambit bonus as well as sparing the Afraid penalty.
  # Torture refuses outright rather than rolling and always failing.
  imperturbable:
    catalog: all
    name: Imperturbable
    category: general
    group: general-traits
    description: "Your mind is unshakable. Nothing moves your mood from Fine, and there is nothing in you for a torturer to break."
    pointCost: 12
    visible: false
    purchasable: true
    purchasableAfterStart: true
    mastery: true

  # NOT a mastery: an ordinary tag, buyable at creation. Cancels the point
  # penalty a Health tag lays on a fighting rating. It does NOT lift the three
  # Health tags that CAP the band (Dying, Paralyzed, Seizure) — those take you
  # out of a fight rather than making you worse at one (COMBAT.md).
  second-wind:
    catalog: all
    name: Second Wind
    category: general
    group: general-traits
    description: "You fight through it. Wounds and illness cost you nothing at all in a fight, though being at death's door still ends one."
    pointCost: 6
    visible: false
    purchasable: true
    purchasableAfterStart: true

  # --- Brigands -------------------------------------------------------------
  brigand:
    catalog: gm
    name: Brigand
    category: general
    group: general-traits
    description: "You live outside the law and the walls."
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false

  # Two Brigand-group entries that are skills in everything but their category.
  # The Brigand gate is a GROUP gate (taggroups.yaml `general-brigand`), and a
  # group's category has to match its tags', so a brigand-only competence has
  # to be filed under `general` — same reason Forger and Pickpocketing (Skilled)
  # already are. (Pickpocketing (Basic) used to be a third; it left the group on
  # 2026-09-16 and is open to everyone now.)
  biter:
    catalog: gm
    name: Biter
    category: general
    group: general-brigand
    description: "You are a ferocious and uninhibited biter. It works even when you're {tag:bound}."
    fighting: { tree: melee, tiers: 0.3 }
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  camouflage:
    catalog: gm
    name: Camouflage
    category: general
    group: general-brigand
    teachable: true
    description: "You blend into the forest. Useful for ambushes."
    fighting: { situational: true }
    pointCost: 3
    purchasable: true
    purchasableAfterStart: true

  forger:
    catalog: gm
    name: Forger
    category: general
    group: general-brigand
    description: "You know how to make letters, seals, and writing appear as though another wrote it. Allows you to craft wax seals."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  # Out of the Brigand group on 2026-09-16, when the Pickpocket button was
  # built and the tag stopped being decorative. The slug stays `pickpocket` on
  # purpose: db:sync-tags is upsert-only, so renaming in place keeps every
  # Brigand who already bought it. general-traits carries no requiredTag, which
  # is the whole of "anyone may learn this now" — the gate was never on the tag,
  # it was on the group (taggroups.yaml `general-brigand`).
  pickpocket:
    catalog: all
    name: Pickpocketing (Basic)
    # See comment above: slug stays `pickpocket` on purpose, so the rename
    # keeps every Brigand who already bought it. keepSlug: true tells the
    # syncer this drift is deliberate.
    keepSlug: true
    category: general
    group: general-traits
    description: "Your hands lighten burdened pockets. Your thefts are very hard to detect."
    pointCost: 3
    purchasable: true
    purchasableAfterStart: true

  # requiredTag, not parentTag: a prerequisite that does NOT replace, so a
  # master holds both rungs and pays 5 in total. parentTag would delete Basic on
  # purchase and leave every gate in db/lib/pickpocket.js having to accept
  # either tag to mean the same thing.
  #
  # Still in general-brigand, so the Basic rung is open to everyone and the
  # second one is not.
  pickpocketing-skilled:
    catalog: all
    name: Pickpocketing (Skilled)
    category: general
    group: general-brigand
    description: "Your pickpocketing almost always succeeds."
    pointCost: 2
    requiredTag: pickpocket
    visible: false
    purchasable: true
    purchasableAfterStart: true

  brigand-leader:
    catalog: gm
    name: Brigand Leader
    category: general
    group: general-brigand
    description: "The camp in the Black Hills answers to you."
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false

  # The new general `climbing` skill overlaps this brigand-gated trait.
  # Gunboat to decide whether one of them should go.
  acrobat:
    catalog: gm
    name: Acrobat
    category: general
    group: general-brigand
    description: "Your exploits are of some renown."
    pointCost: 3
    purchasable: true
    purchasableAfterStart: true

  wanted:
    catalog: gm
    name: Wanted
    category: general
    group: general-brigand
    description: "The Cerberon know your face and have a reward on your head."
    pointCost: -5
    # named, not true: they know your FACE. A hood or a Disguise Kit's false
    # name takes this off the read, which is what makes either worth buying.
    visible: named
    purchasable: true
    purchasableAfterStart: false

  mountaineering:
    catalog: all
    name: Mountaineering
    category: skills
    teachable: true
    description: "You can climb mountains, granting you access to certain locations."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  # The Cathedral's one craft. requiredTag keeps it off everybody else's
  # point-buy: `chaplain` is catalog: gm and unpurchasable, so the only people
  # who can ever spend the 5 are the Bishop and the Chaplains.
  blessing:
    catalog: all
    name: Blessing
    category: skills
    requiredTag: chaplain
    description: "You can craft {tag:holy-water}. Poured on the offender, it reduces the efficacy of unholy activity."
    pointCost: 3
    purchasable: true
    purchasableAfterStart: true

  # The Scholastic's own craft, granted only through `scholastic.starting_tags`
  # (docs/roles.yaml) — 0-point, unpurchasable, like every other role grant
  # (TAGS.md §4a). Not teachable: it is the role's own work, not a lesson,
  # the same exception the Teaching tree carries on `teachable` (TAGS.md
  # "teachable" note, `teaching-drill-instructor` above).
  research:
    catalog: gm
    name: Research
    category: skills
    teachable: false
    description: "The Cathedral's archives hold many secrets. Use them to research forgotten uses for ingredients, revealing secret recipes."
    pointCost: 0
    purchasable: false
    purchasableAfterStart: false

  caving:
    catalog: all
    name: Caving
    category: skills
    teachable: true
    description: "You know about some secret connections between the surface and the caves."
    pointCost: 4
    purchasable: true
    purchasableAfterStart: true

  artist:
    catalog: all
    name: Artist
    category: skills
    teachable: true
    description: "Well, it's lovely, but I'm not paying for it. You draw, paint, sculpt, act, or pursue another creative medium inessential for survival. Perhaps you can find a patron? The Merchant might buy these… You can craft a {tag:painting}, but it takes 4 turns."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  # No longer a gate on the Mine button — anybody standing where there is a
  # seam can press it (MINING.md). What the skill buys is the size of the
  # day: double the Resources, and the loot roll that an unskilled digger
  # never makes at all.
  prospecting:
    catalog: all
    name: Prospecting
    category: skills
    group: skills-work
    teachable: true
    description: "You obtain many resources while mining, plus have a chance to obtain ores and gemstones."
    pointCost: 7
    purchasable: true
    purchasableAfterStart: true

  soilery:
    catalog: all
    name: Soilery
    category: skills
    group: skills-work
    teachable: true
    description: "You can grow crops in the fields."
    pointCost: 7
    purchasable: true
    purchasableAfterStart: true

  forester:
    catalog: all
    name: Forester
    category: skills
    teachable: true
    description: "You are at home in the woods, gaining an advantage in finding food, water, or shelter."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  musician:
    catalog: all
    name: Musician
    category: skills
    teachable: true
    description: "You sing or play instruments. People love your musical talents."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  # A Musician MASTERY: quadruples what /play is worth to everyone who hears
  # it. Gated on Musician because the mood half of /play already lives inside
  # that check (db/lib/instrumentPlay.js) — without the parent, playing badly
  # soothes nobody and this would be worth nothing.
  musician-pythagorean:
    catalog: all
    name: Musician (Pythagorean)
    category: skills
    teachable: false
    description: "Your music is complex and absorbing. It makes everyone ecstatic, buffing their mood massively."
    pointCost: 14
    requiredTag: musician
    visible: false
    purchasable: true
    purchasableAfterStart: true
    mastery: true

  # Smithing is split into two rungs, gating the Dead Simple / Simple recipes
  # against the Moderate / High Quality / Exceptional ones. Full price and
  # resource table in SMITHING.md.
  smithing:
    catalog: all
    name: Smithing I
    # Roman-numeral rung name (game 3 tier rename); slug kept as-is
    # so no character loses the tag and every parentTag/requiredTag
    # reference stays valid. See docs/systemdocs/REDESIGN.md §7.
    keepSlug: true
    category: skills
    group: skills-crafting
    teachable: true
    description: "Basic smithing."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  smithing-skilled:
    catalog: all
    name: Smithing II
    # Roman-numeral rung name (game 3 tier rename); slug kept as-is
    # so no character loses the tag and every parentTag/requiredTag
    # reference stays valid. See docs/systemdocs/REDESIGN.md §7.
    keepSlug: true
    category: skills
    group: skills-crafting
    teachable: true
    description: "Skilled smithing — the Moderate and higher recipes."
    pointCost: 5
    parentTag: smithing
    visible: false
    purchasable: true
    purchasableAfterStart: true

  crafting:
    catalog: all
    name: Crafting
    category: skills
    group: skills-crafting
    teachable: true
    description: "Lets you tailor, craft, woodwork, and any other form of miscellaneous production. Also fulfills requirements for Dead Simple smithing recipes."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  butcher:
    catalog: all
    name: Butcher
    category: skills
    teachable: true
    description: "You can butcher monster and human corpses."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  # NOTHING USES THIS RIGHT NOW, and that is worth saying out loud rather than
  # leaving for somebody to discover. Its eight recipes were the per-location
  # lockboxes, and all eight went on 2026-09-18 — seven with the old drop table
  # and {tag:netted-lockbox} with them, since nothing had granted that one for a
  # long time either. The skill is kept on purpose (Bascinet's call): a lock is
  # an obvious thing for the game to want later, and the replacement
  # {tag:lockbox} is one edit away from needing it. Until something does, this
  # is 4 points for nothing — do not sell it to a player as anything else.
  lockpicking:
    catalog: all
    name: Lockpicking
    category: skills
    teachable: true
    description: "Nothing on one… little click on two… click on three… aha! You can pick locks."
    pointCost: 4
    purchasable: true
    purchasableAfterStart: true

  climbing:
    catalog: all
    name: Climbing
    category: skills
    teachable: true
    description: "You used to go up the mountains as a child."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  # The one Skill that reads on a gate crossing
  # (db/lib/locationMove.js#announceLevelFor). It moves the announcement down
  # one step: an unmanned gate says nothing at all, a manned one describes you
  # instead of naming you. Price left at 5 — Bascinet's call when it stopped
  # being flavour, so it stays on the ordinary Moderate band.
  stealth:
    catalog: all
    name: Stealth
    category: skills
    teachable: true
    description: "You are adept at sneaking around and concealing yourself. Others will be less likely to spot you doing so."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  smithing-gunpowder:
    catalog: all
    name: Smithing (Gunpowder)
    category: skills
    group: skills-crafting
    # The one mastery that IS teachable, on purpose: powder is a formula, and
