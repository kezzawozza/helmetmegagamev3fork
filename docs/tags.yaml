  # --- Beliefs --------------------------------------------------------------
  # What a character actually believes. The setting has said so for a while —
  # #info's "most people are Post-Christian, but some people believe in the Old
  # Ways", the Post-Christianity document, the shrine to Thoth in the Caves —
  # and this is the first time any of it reaches a sheet.
  #
  # ONE BELIEF PER CHARACTER, enforced by `exclusive: true` below. A character
  # may hold at most one exclusive tag — the one exception being a pair joined
  # by requiredTag, which is how Fundamentalist stacks on Post-Christian.
  # Checked at creation, at /store checkout and in the Add Tag request; a GM
  # grant bypasses it like every other gate. Pilgrim and Saint sit in this same
  # group and are deliberately NOT exclusive: they stack on top of a belief.
  # See docs/systemdocs/TAGS.md §5.
  #
  # A belief cannot be dropped from the sheet. Destroy is for items now
  # (docs/systemdocs/CRAFTING.md §5), and these are not items, so converting
  # mid-game is a GM's to make rather than a thing a player does by buying
  # over the top of one. That also closes the farm the old pairing had to
  # argue its way out of: there is no drop step left to repeat.
  #
  # None is `visible`. You cannot tell an Atheist from a Post-Christian by
  # looking, and docs/tag-design.md sets that flag by whether a bystander
  # actually could. A belief is meant to come out in play, not off a inspect.
  post-christian:
    catalog: all
    name: Post-Christian
    category: general
    group: general-beliefs
    description: "You are protected by God. A reasonable decision, and potentially a path to Heaven."
    pointCost: 0
    purchasable: true
    purchasableAfterStart: true
    exclusive: true

  atheist:
    catalog: all
    name: Atheist
    category: general
    group: general-beliefs
