    purchasable: true
    purchasableAfterStart: true

  tactician-defending:
    catalog: all
    name: Tactician (Defending)
    category: general
    group: general-traits
    description: "Your battle plans go particularly well when you're on the defense."
    fighting: { tree: both, tiers: 0.3, situational: true }
    pointCost: 2
    requiredTag: tactician
    purchasable: true
    purchasableAfterStart: true

  strong:
    catalog: all
    name: Strong
    category: general
    group: general-traits
    description: "You possess high functional strength. {carry:strong}."
