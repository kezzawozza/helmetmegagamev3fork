  # --- Depot imports ------------------------------------------------------
  # Everything the Merchant's shuttle brings down from the orbital station.
  # The canonical price table is docs/systemdocs/DEPOT.md §3 — change a
  # `depotPrice` here and change it there in the same commit.
  #
  # These are kept in one block rather than filed under Items/Assets by kind,
  # because what they have in common is the shelf they sit on: DEPOT.md has to
  # stay in step with them, and a scattered set would drift. `category:` and
  # `group:` are still correct per entry, and the sync reads those, not the
  # section a tag happens to sit in.
  #
  # House rules for this block:
  #   * `purchasable: false` on almost everything. The Merchant is the ONLY
  #     source in the game — that is the whole point of the seat, and a ware
  #     a player could just buy at creation gives him nothing to sell. The one
  #     exception is the Poison Snooper, deliberately priced high at 4 pt.
  #   * `pointCost: 0` follows from that: an unpurchasable tag's point cost is
