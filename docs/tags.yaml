  # --- assets -------------------------------------------------------
  # `tradeable` decides what can be handed over OR lifted off a body, so every
  # entry here states it outright (db/lib/syncTags.js enforces that). Mounts,
  # vehicles and ordinary animals travel: they are standing right there and
  # anyone can lead them away. Real property does not — you cannot carry a boat
  # off a corpse.
  # Arelitz (docs/systemdocs/ARELITZ.md): replaces the old Horse +
  # Warbeast/Ovum/Thoroughbred family. One mount type rather than three bred
  # variants (Bascinet's call) — an adult is `unruly-arelitz` by default, and
  # `arelitz-mastery` lets someone break one in via a Gambit
  # (ARELITZ.md §6). Bred only, in a Stable room (`Room.stable`) — neither
  # this tag nor any of the brood rungs below is craftable; db/lib/stablePass.js
  # is the only thing that mints one.
  arelitz:
    catalog: all
    name: Arelitz
    category: assets
    group: assets-companions
    description: "A great eight legged spider. It has been broken in, allowing it to be rode by up to two people. Riders are able to move an extra zone."
    pointCost: 9
    tradeable: true
    stackable: true
    equippable: true
    equipSlot: MOUNT
    equipLayer: 1
    purchasable: false
    purchasableAfterStart: false
    visible: true
    depotPrice: 81
    sellable: true
    sellablePrice: 54

  # Identical to a broken-in arelitz except not equippable — that omission IS
  # "cannot be ridden", the whole enforcement (mounts.js only ever reads the
  # ACTIVE/equipped slug set, so a tag that can't equip can't be a mount).
  # Still counts as an adult for the stable's feed-and-lay pass.
  unruly-arelitz:
    catalog: all
    name: Unruly Arelitz
    category: assets
    group: assets-companions
    description: "It has yet to learn to fear its masters, and will refuse any rider. This great spider must be broken in before it can be used as a mount."
