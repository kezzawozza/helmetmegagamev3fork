        3:  # EV 30.00 ⬢ · hit 100%
          - { slug: ore-vein, rarity: rare }  # sells 30 ⬢
        4:  # own EV 30.00 ⬢ · hit 100% · combined EV 14.26 ⬢ · hit 100%
          - { slug: ore-sack, rarity: extremely-rare }  # sells 30 ⬢
        5:  # own EV 24.00 ⬢ · hit 100% · combined EV 13.71 ⬢ · hit 100%
          - { slug: ore-nugget, rarity: extremely-rare }  # sells 24 ⬢
        6:  # own EV 33.00 ⬢ · hit 100% · combined EV 5.32 ⬢ · hit 100%
          - { slug: rich-ore-package, rarity: rare }  # sells 33 ⬢
