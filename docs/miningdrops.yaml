# The mining drop die's config. Sole master for MiningDropOption, synced by
# `db:sync-mining-drops` — see docs/systemdocs/MININGDROPS.md, which is
# canonical for the shape below and how the three buckets combine.
#
# Three top-level buckets, one per legal scope: global, zone and location.
# Each nests roll face (1-6) -> a pool (a plain list). A combined draw for one
# day's mining pulls from whichever of the three actually name where the
# character is standing, all at the SAME roll face, pooled together.
#
# THE DRAW IS TWO-STAGE, the shape db/lib/cavingLoot.js has always had: land
# on a rarity band by the die face's column, then pick evenly among that
# band's members. db/lib/miningdropsRarity.js owns the columns.
#
# One pool entry is one of three things:
#   - { slug: rope, rarity: uncommon }         -> grants the tag
#   - "+N" / "-N"                               -> a ⬢ delta
#   - nothing                                   -> the pool can miss
#
# EVERY FIND CARRIES A RARITY, one of, commonest first:
#
#   ultracommon  common  uncommon  rare  extremely-rare  nearly-impossible
#
# The same six names cavingLoot.js uses — two loot systems in one game should
# not speak two vocabularies — though not the same numbers, because a cave 6
# and a mining 6 are different events.
#
# RARITY IS ABSOLUTE. A `rare` entry is worth its band's share whatever else
# sits beside it, and the bands nobody authored give their share to the
# commonest TIER present (never to a ⬢ delta, which would otherwise become the
# likeliest outcome of half these pools). That is what stops one bucket
# diluting another: adding a local table no longer steals probability from the
# global one.
#
# `nothing` IS NOT A PAD ANY MORE — it is one line saying "this pool can
# miss", and how often is the face's column, not how many times you wrote it.
# 53 pad lines and 87 duplicate lines came out of this file when that landed,
# along with the footgun MININGDROPS.md used to warn about: adding a wound no
# longer raises the wound rate everywhere the bucket applies. Say `nothing`
# once or not at all; the sync refuses a second, and refuses a repeated tag
# for the same reason (a repeat is a copy-paste now, not a weight).
#
# zone / location keys are slugs from docs/zones.yaml. Only a place that
# carries a `mining:` coefficient can ever be drawn at, so a bucket naming
# anywhere else is dead config (MINING.md §3). Refining and Farming never roll
# this die at all — they pay in Squeeze and in crops, not in ore.
#
# A LAST gate, orthogonal to all three buckets: nest `requiresTag:` under
# any roll-keyed node (a whole bucket, or one place inside it) to
# add a skill-gated pool on top — a map of skill slug -> the same roll-keyed
# shape, recursively, so it can nest to any depth. A gated entry only joins
# the combined draw for a character who holds that tag too; every ungated
# entry at the same roll still applies to everyone, same as before. See
# MININGDROPS.md §2a.
#
# EVERY roll-1 bucket carries its own `nothing` pad, and that is not
# decoration. The draw is uniform over the CONCATENATION of whichever buckets
# match, so a pad in `global` alone is diluted the moment a zone bucket joins
# it — pad one bucket and a 1 still always hurts, for exactly the characters
# standing somewhere dangerous. The pads deepen as buckets stack (global 30%,
# hunting 40%, every zone and cross bucket 50%), which is why a hunter in the
# Depths is slightly SAFER per 1 than a labourer in Town. Add a wound to a
# roll-1 bucket and you must add pad with it, or you have quietly raised the
# wound rate everywhere that bucket applies.
#
# Basic/skilled on their own are still unconfigured — an unconfigured
# (bucket, roll) pair simply never contributes to the pool, so a character
# digs and finds nothing, same as an explicit "nothing" draw. That's the
# deliberate default while the rest of the table gets designed.
#
# Every pool entry below carries a short "why" blurb before its mechanical
# value (`slug  # blurb — value`, MININGDROPS.md §6b) — write the blurb
# yourself when you add an entry; `npm run db:audit-mining-drops -- --write`
# (which runs automatically on save, via .claude/hooks/miningdrops-value-hint.py)
# preserves it and only refreshes what comes after " — ". Never hand-guess a
# number — run `--write` (or the plain read-only form) instead.

# Global entries combine into every place's pool at the same roll face
# (MININGDROPS.md §2), which is exactly why the minor mishaps below live here
# instead of being copy-pasted into hunting/farming/fishing separately —
# there's no tag in the catalog that reads as hunting-specific-minor-injury
# vs farming-specific, so one shared "the day went a little wrong" pool
# covers all of them. All three are self-clearing in 2-3 turns with no
# mechanical cost beyond the flavor (MININGDROPS.md §6 has the reasoning) —
# `miningDrop` in db/lib/moveEffects.js stamps the catalog's durationTurns onto
# the grant, so they really do tick.
global:
  1:  # EV 0.00 ⬢ · hit 55%
    - { slug: bruised, rarity: ultracommon }  # an ordinary knock, nothing dramatic — not sellable
    - { slug: vomiting, rarity: ultracommon }  # something you ate, or just a bad morning — not sellable
    - { slug: aching, rarity: ultracommon }  # a long day, nothing more — not sellable
    - nothing
    - { slug: hematite, rarity: common }  # a red ore, easy to spot even on a bad day — sells 3 ⬢
  6:  # EV 1.00 ⬢ · hit 100%
    - { slug: obol, rarity: ultracommon }  # someone dropped it and never noticed — the coin itself, worth 1 ⬢
    - { slug: silt-lockbox, rarity: uncommon }  # turns up wherever the digging is good — worth 18 ⬢ opened (sells 9 ⬢ locked)
    - { slug: knuckle-duster, rarity: uncommon }  # sells 21 ⬢
  # This pool used to hang off a Keen Eye tag of its own. That tag is
  # retired: Eagle Eyes carries the pool now, and nothing says so anywhere
  # a player can read it — the skill is meant to be found, not shopped for.
  #
  # Redesigned 2026-09-20 four times over (Bascinet: "make sure it
  # gives at least +1, hopefully +2 on average" — "I don't like the flat
  # resources, use item drops" — a supernova, see below — "less spiky,
  # every number 1-6, many medium prizes instead of juggernauts"). A
  # "requiresTag" entry JOINS whatever band it's authored at (MININGDROPS.md
  # §2, §7), which only helps if it's worth MORE than that band's existing
  # members — the first item-only pass got that wrong at a few locations
  # and the skill measurably hurt. Picking an unused rarity isn't enough
  # either, if it's an EARLY one: the second pass put a 51 ⬢ item at
  # "common" on face 5, and most locations have nothing earlier than that
  # live there — so "common" inherited almost the face's ENTIRE
  # probability (the leftover from every tier nobody authored) instead of
  # its own ~28% column share, and the average shot to +5.6 ⬢/day from
  # one slot.
  #
  # The rule that actually holds: only use a rarity STRICTLY LATER, in
  # TIERS order (db/lib/miningdropsRarity.js), than whatever
  # the global pool's own ungated entries ALWAYS put on that face —
  # that earlier tier is always live, so it always wins the "commonest"
  # tiebreak instead, and the grant's share is capped at its own column
  # percentage, full stop. The global mishap pool (`global.1`, every face 1
  # everywhere) plays the same guaranteeing role at face 1 that
  # the global pool plays at 2/4/5/6, so every one of mining's
  # six faces now has a floor: `ultracommon` (1), `common` (2), `uncommon`
  # (3, since 2026-09-20 — zone.hills/zone.forest picked up a face-3 entry
  # apiece specifically so this floor exists everywhere), `uncommon` (4),
  # `rare` (5), `uncommon` (6). The pool sits one step later than each:
  # `common`/`uncommon`/`rare`/`extremely-rare`/`extremely-rare`/`rare`.
  # Face 5 is the one exception worth flagging: its next tier up,
  # `extremely-rare`, is already crowded with 4-42 ⬢ gear at several
  # locations (a Basement Lockbox worth 61 ⬢ ASSUMED among them), so a
  # MEDIUM item there risks diluting the high rollers even though it can
  # never win the tiebreak — kept small on purpose rather than sized to
  # match the other five.
  #
  # Six modest finds (tags.yaml, 14-33 ⬢ each) rather than three big ones
  # (previously 51-60 ⬢ each) — the same total floor, spread thinner and
  # across every face on purpose. Verified across all 29 Prospecting
  # locations: floor +1.79 ⬢/day (worst case, Underlocks), average
  # +2.12, zero locations hurt.
  3:  # a floor for malachite, same reasoning: face 3 carried nothing before it
    - { slug: malachite, rarity: uncommon }  # a green mineral, worth an inlay — sells 6 ⬢
  2:  # EV 2.13 ⬢ · hit 100%
    - { slug: sweets, rarity: common }  # a rarity, tucked away and forgotten — sells 2 ⬢
    - { slug: nightshade-herb, rarity: common }  # sells 2 ⬢
    - { slug: poppy-pods, rarity: common }  # sells 2 ⬢
    - { slug: coca-leaves, rarity: common }  # sells 2 ⬢
    - { slug: honey, rarity: common }  # sells 2 ⬢
    - { slug: wild-mushroom, rarity: common }  # sells 2 ⬢
    - { slug: faded-photograph, rarity: common }  # whoever's in it isn't anymore — sells 2 ⬢
    - { slug: warding-bead, rarity: common }  # didn't work, or the strand would still be whole — sells 3 ⬢
  4:  # EV 13.50 ⬢ · hit 100%
    - { slug: distilled-coca, rarity: uncommon }  # somebody's private stash, dropped and forgotten — sells 10 ⬢
    - { slug: ore-package, rarity: uncommon }  # sorted and ready for the forge — sells 17 ⬢
  5:  # EV 13.00 ⬢ · hit 100%
    - { slug: heirloom, rarity: rare }  # sells 12 ⬢
    - { slug: sword-cane, rarity: rare }  # an elegant thing, buried with whoever carried it — sells 14 ⬢
